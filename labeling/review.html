const QUEUE = [{"id": 10430, "text": "Total consumer price inflation\u00e2\u0080\u0094as measured by the 12-month change in the price index for personal consumption expenditures (PCE)\u00e2\u0080\u0094was 3.8 percent in April.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9034, "text": "Inflation was projected to decline in 2026, to reach 2 percent in 2027, and to remain there in 2028.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9357, "text": "They observed that job gains had slowed this year and that the unemployment rate had edged up but remained low through August.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11811, "text": "The next scheduled date for announcing the overnight rate target is January 28, 2026.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9104, "text": "Members concurred that inflation remained somewhat elevated and agreed to add that inflation had moved up.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9152, "text": "The Committee decided to conclude the reduction of its aggregate securities holdings on December 1.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11782, "text": "The structural damage caused by the trade conflict reduces the capacity of the economy and adds costs.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10138, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 8931, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11817, "text": "Tariffs are pushing up US inflation, although their effect is expected to fade gradually later this year.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8781, "text": "The staff continued to expect that the labor market would weaken, with the unemployment rate projected to move above the staff's estimate of its natural rate around the end of this year and to remain above the natural rate through 2027.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 9443, "text": "The Committee's assessments will take into account a wide range of information, including readings on labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11874, "text": "As the outlook evolves, we stand ready to respond as needed.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9624, "text": "Some participants who favored or could have supported keeping the target range unchanged suggested that the arrival of a considerable amount of labor market and inflation data over the coming intermeeting period would be helpful in making judgments on whether a rate reduction was warranted.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10626, "text": "Housing activity also declined and business investment remained weak.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10684, "text": "The Bank\u2019s next MPR will be released on October 28, 2026.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10554, "text": "Voting against this action: None .", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10590, "text": "The outlook for economic growth in Canada is little changed from the January Monetary Policy Report (MPR) projection.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10490, "text": "The majority of participants commented that most measures of medium- and longer-term inflation expectations remained at levels consistent with the Committee's 2 percent objective.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10624, "text": "In Canada, GDP edged down by 0.1% in the first quarter, weaker than expected at the time of the April MPR.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9925, "text": "The Committee is strongly committed to supporting maximum employment and returning inflation to its 2 percent objective.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10365, "text": "The Committee is strongly committed to supporting maximum employment and returning inflation to its 2 percent objective.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10145, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9693, "text": "In support of its goals, the Committee decided to maintain the target range for the federal funds rate at 3\u00e2\u0080\u00911/2 to 3\u00e2\u0080\u00913/4 percent.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10637, "text": "Against this overall backdrop, Governing Council decided to maintain the policy rate at 2.25%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10598, "text": "While the war in Iran may alter its composition, overall GDP growth is little changed in the updated forecast: Since Canada is a large net exporter of oil, higher oil prices increase national income even as consumers are squeezed by higher gasoline prices.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11842, "text": "The next scheduled date for announcing the overnight rate target is March 18, 2026.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10636, "text": "With global oil prices still elevated\u2014roughly $10 a barrel above our April MPR assumptions\u2014total inflation is expected to hover around 3% in the near term before easing gradually towards 2%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11866, "text": "CPI inflation excluding changes in indirect taxes as well as core inflation measures have also come down and are all close to 2%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10399, "text": "Asset prices were affected by a number of factors, including developments related to the conflict in the Middle East, continued solid real economic data, higher inflation data, and ongoing investment in artificial intelligence (AI).", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9893, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9150, "text": "In support of its goals and in light of the shift in the balance of risks, the Committee decided to lower the target range for the federal funds rate by 1/4 percentage point to 3-3/4 to 4 percent.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10615, "text": "The conflict in the Middle East is now in its fourth month.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9245, "text": "The government shutdown was expected to reduce GDP growth for as long as it continued, with a corresponding boost to growth once the government reopened and government production and purchases returned to normal levels.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9143, "text": "October 29, 2025 Available indicators suggest that economic activity has been expanding at a moderate pace.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9378, "text": "Participants judged that a careful balancing of risks was required and agreed on the importance of well-anchored longer-term inflation expectations in achieving the Committee's dual-mandate objectives.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 8926, "text": "In support of its goals and in light of the shift in the balance of risks, the Committee decided to lower the target range for the federal funds rate by 1/4 percentage point to 4 to 4\u00e2\u0080\u00911/4 percent.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11834, "text": "Excluding the effect of changes in taxes, inflation has been slowing since September.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10674, "text": "Excluding gasoline, inflation was 2.2% and measures of core inflation remained close to 2%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10668, "text": "Business investment is projected to pick up modestly, boosted in the near term by the oil and gas sector.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9436, "text": "Uncertainty about the economic outlook remains elevated.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9551, "text": "Financing conditions remained somewhat restrictive for households and small businesses.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10611, "text": "The Bank is committed to maintaining Canadians\u2019 confidence in price stability through this period of global upheaval.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11871, "text": "At the same time, inflation risks have gone up due to higher energy prices.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10605, "text": "CPI inflation will likely rise further in April to about 3%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9838, "text": "While participants generally assessed that, under appropriate monetary policy, the labor market likely would stabilize and then improve this year, they continued to note that the outlook for the labor market remained uncertain.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 9442, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9640, "text": "Members observed that more recent indicators were consistent with these developments.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8726, "text": "Headline inflation rates were near targets in most foreign economies, held down by past declines in oil prices and fading wage pressures following a tightening in monetary policy stances over the past few years.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10683, "text": "The next scheduled date for announcing the overnight rate target is September 2, 2026.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11831, "text": "The Bank projects growth of 1.1% in 2026 and 1.5% in 2027, broadly in line with the October projection.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9158, "text": "Voting against this action were Stephen I. Miran, who preferred to lower the target range for the federal funds rate by 1/2 percentage point at this meeting, and Jeffrey R. Schmid, who preferred no change to the target range for the federal funds rate at this meeting.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 9126, "text": "Voting against this action: Stephen I. Miran.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9949, "text": "Treasury yields ended the intermeeting period higher, on net, more so at the short end.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11827, "text": "Employment has risen in recent months.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10630, "text": "Recent data suggests that growth will resume in the second quarter but, even with some rebound, the economy is expected to remain in excess supply.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11719, "text": "Growth in the euro area has moderated as US tariffs affect trade.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9160, "text": "Implementation Note issued October 29, 2025", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9704, "text": "The elected members and alternate members were as follows: John C. Williams, President of the Federal Reserve Bank of New York, with Sushmita Shukla, First Vice President of the Federal Reserve Bank of New York, as alternate", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10655, "text": "Economic activity in the euro area has been weighed down by high energy prices, but is expected to strengthen in the second half of the year if energy prices come down as anticipated.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10597, "text": "With GDP growing slightly above potential, the current excess supply in the economy is gradually absorbed.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10634, "text": "Measures of core inflation have moved down to around 2% and the share of CPI components growing above 3% is close to its historical average.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10568, "text": "Economic activity is expanding at a solid pace despite elevated uncertainty that owes, in part, to the conflict in the Middle East.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9701, "text": "For media inquiries, please email [email protected] or call 202-452-2955.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10653, "text": "The US economy is growing at about 2\u00bd%, mostly because of strong consumption and booming AI investment.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8933, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Michael S. Barr; Michelle W. Bowman; Susan M. Collins; Lisa D. Cook; Austan D. Goolsbee; Philip N. Jefferson; Alberto G. Musalem; Jeffrey R. Schmid; and Christopher J. Waller.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9636, "text": "By contrast, several participants pointed to the risk of higher inflation becoming entrenched and suggested that lowering the policy rate further in the context of elevated inflation readings could be misinterpreted as implying diminished policymaker commitment to the 2 percent inflation objective.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9264, "text": "Late in the period, the spread between the EFFR and the IORB reached the narrowest level since the runoff of the Federal Reserve's balance sheet began in 2022.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10672, "text": "As the recovery proceeds, economic slack will be gradually absorbed.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11768, "text": "Slower population growth means fewer new jobs are needed to keep the employment rate steady.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 9445, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Michael S. Barr; Michelle W. Bowman; Susan M. Collins; Lisa D. Cook; Philip N. Jefferson; Alberto G. Musalem; and Christopher J. Waller.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11778, "text": "If inflation and economic activity evolve broadly in line with the October projection, Governing Council sees the current policy rate at about the right level to keep inflation close to 2% while helping the economy through this period of structural adjustment.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9952, "text": "Broad equity prices fell about 5 percent over the period.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8928, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8923, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10136, "text": "Job gains have remained low, on average, and the unemployment rate has been little changed in recent months.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 9216, "text": "The presentation noted that the current share of Treasury bills in the SOMA portfolio was smaller than the bill share of total Treasury securities outstanding.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11761, "text": "US trade actions and related uncertainty are having severe effects on targeted sectors including autos, steel, aluminum, and lumber.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10650, "text": "At the same time, the build-out of artificial intelligence (AI) is supporting economic activity in a growing number of countries.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9449, "text": "Implementation Note issued December 10, 2025", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11851, "text": "China\u2019s economy continues to be boosted by strength in exports, but domestic demand remains weak.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9354, "text": "A couple of participants cited risks associated with high levels of corporate borrowing.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9550, "text": "In domestic credit markets, conditions for businesses, households, and municipalities were little changed on balance.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11754, "text": "At the same time, employment growth has slowed and tariffs have started to push up consumer prices.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11833, "text": "CPI inflation picked up in December to 2.4%, boosted by base-year effects linked to last winter\u2019s GST/HST holiday.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9154, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10144, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10645, "text": "The Bank of Canada today held its target for the overnight rate at 2.25%, with the Bank Rate at 2.5% and the deposit rate at 2.20%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9778, "text": "On net, foreign equity price indexes rose and outperformed U.S. counterparts, extending last year's trend.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11722, "text": "Financial conditions have eased further, with higher equity prices and lower bond yields.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8889, "text": "The Committee is strongly committed to supporting maximum employment and returning inflation to its 2 percent objective.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10397, "text": "Implementation Note issued June 17, 2026", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11844, "text": "The Bank of Canada today held its target for the overnight rate at 2.25%, with the Bank Rate at 2.5% and the deposit rate at 2.20%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10389, "text": "June 17, 2026 The Federal Open Market Committee approved the following statement for release by a 12 \u00e2\u0080\u0093 0 vote: The Committee decided to maintain the target range for the federal funds rate at 3-1/2 to 3-3/4 percent, in support of the Federal Reserve's dual mandate.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10125, "text": "It was agreed that the next meeting of the Committee would be held on Tuesday\u00e2\u0080\u0093Wednesday, April 28\u00e2\u0080\u009329, 2026.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9469, "text": "Higher repo rates, along with a lower level of reserves, continued to contribute to upward pressure on the spread between the effective federal funds rate (EFFR) and the interest rate on reserve balances.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11792, "text": "In the euro area, economic growth has been stronger than expected, with the services sector showing particular resilience.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 9048, "text": "Some participants noted that business contacts had indicated that they would raise prices over time because of higher input costs stemming from tariff increases.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8920, "text": "September 17, 2025 Recent indicators suggest that growth of economic activity moderated in the first half of the year.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11858, "text": "This was weaker than expected at the time of the January MPR, but mainly because of a larger-than-expected drawdown in inventories.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10594, "text": "The labour market is soft, with subdued employment growth over the past year and job losses in sectors targeted by US tariffs.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 9183, "text": "In addition, the share of domestic banks borrowing in the federal funds market increased.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11771, "text": "Excess capacity in the economy is expected to persist and be taken up gradually.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 9447, "text": "and Austan D. Goolsbee and Jeffrey R. Schmid, who preferred no change to the target range for the federal funds rate at this meeting.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11798, "text": "Growth is forecast to pick up in 2026, although uncertainty remains high and large swings in trade may continue to cause quarterly volatility.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10606, "text": "Based on the assumption that oil prices will ease, inflation is forecast to come down to the 2% target early next year and remain around 2% over the projection horizon.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 9069, "text": "Several participants saw continuing adoption of artificial intelligence as potentially reducing labor demand.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 10581, "text": "In the United States, growth is still expected to be solid over the projection horizon, boosted by AI-related investment and consumption growth.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10395, "text": "The Committee will deliver price stability.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10584, "text": "Financial conditions have been volatile, reflecting daily developments in the Middle East and shifting market expectations for inflation and interest rates.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8859, "text": "Participants agreed that, if that situation were to occur, they would consider each variable's distance from the Committee's goal and the potentially different time horizons over which those respective gaps would be anticipated to close.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10042, "text": "The Summary of Economic Projections was released to the public following the conclusion of the meeting.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10622, "text": "Global equity markets have been buoyant and bond yields remain volatile.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11855, "text": "Global bond yields have risen, equity market prices have declined, and credit spreads have widened.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11812, "text": "The Bank\u2019s next MPR will be released at the same time.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8922, "text": "Inflation has moved up and remains somewhat elevated.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10451, "text": "The market-implied path of the policy rate over the latter half of this year increased during the intermeeting period, and related measures of uncertainty about the path of policy rose, partly reflecting a higher term premium.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11861, "text": "The labour market remains soft.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 9593, "text": "Some participants noted, however, that other indicators, such as weekly initial unemployment insurance claims and measures of job postings, suggested more stability.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11790, "text": "The US government shutdown caused volatility in quarterly growth and delayed the release of some key economic data.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10604, "text": "Near-term inflation expectations have moved up with higher gasoline prices and still-elevated food price inflation, but longer-term inflation expectations have remained anchored.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9035, "text": "The staff continued to view the uncertainty around the projection as elevated, primarily reflecting uncertainty regarding changes to economic policies, including those for trade, immigration, fiscal spending, and regulation, and their associated economic effects.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10380, "text": "Attended through the discussion of developments in financial markets and open market operations.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10662, "text": "The unemployment rate was 6.5% in June and has hovered in a range of 6\u00bd%-7% since the end of 2024.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10370, "text": "Consistent with the Committee's decision to leave the target range for the federal funds rate unchanged, the Board of Governors of the Federal Reserve System voted unanimously to maintain the interest rate paid on reserve balances at 3.65 percent, effective April 30, 2026.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11751, "text": "Trade relationships are being reconfigured and ongoing trade tensions are dampening investment in many countries.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11830, "text": "In the projection, consumer spending holds up and business investment strengthens gradually, with fiscal policy providing some support.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11721, "text": "Global oil prices are close to their levels assumed in the July Monetary Policy Report (MPR).", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9721, "text": "Shorter-term Treasury yields were little changed, while longer-term yields rose a few basis points on net; the Treasury curve steepened slightly as a result.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11764, "text": "Canada\u2019s labour market remains soft.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 10018, "text": "However, firms judged to have significant exposure to AI disruption saw sharp increases in their borrowing costs.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11799, "text": "Canada\u2019s labour market is showing some signs of improvement.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11776, "text": "The Bank expects inflationary pressures to ease in the months ahead and CPI inflation to remain near 2% over the projection horizon.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11800, "text": "Employment has shown solid gains in the past three months and the unemployment rate declined to 6.5% in November.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 8721, "text": "Real imports of goods and services declined sharply, likely reflecting the aftereffects of the substantial front-loading of imports recorded in the first quarter ahead of anticipated tariff hikes.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9691, "text": "Uncertainty about the economic outlook remains elevated.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10677, "text": "CPI inflation is expected to stay elevated in June and then ease gradually in the coming months, returning to around 2% in early 2027, although this forecast is dependent on the path for oil and gasoline prices.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9262, "text": "The broad dollar index increased modestly, primarily driven by the relative strength of U.S. economic data.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10488, "text": "Several participants commented that price pressures had become more broad based, with a large share of goods and services\u00e2\u0080\u0094including transportation, airfares, petrochemical products, and agricultural inputs\u00e2\u0080\u0094experiencing substantial increases.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9441, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11796, "text": "The increase in GDP largely reflected volatility in trade.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9793, "text": "3 The overall level of bank lending standards aggregated across all loan categories was estimated to be around the median level observed since 2011.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11758, "text": "The Canadian dollar has depreciated slightly against the US dollar.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11850, "text": "In the euro area, domestic demand is supporting growth while exports have contracted.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10550, "text": "Productivity growth and capital investment are strong.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10587, "text": "The Canada-US exchange rate has been relatively stable.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9364, "text": "In light of their assessment that reserve balances had reached or were approaching ample levels, almost all participants noted that it was appropriate to conclude the reduction in the Committee's aggregate securities holdings on December 1 or that they could support such a decision.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 9434, "text": "Inflation has moved up since earlier in the year and remains somewhat elevated.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10317, "text": "Many participants commented on developments in the private credit sector.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11857, "text": "After expanding by 2.4% in the third quarter of last year, GDP in Canada contracted 0.6% in the fourth quarter.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11791, "text": "Tariffs are causing some upward pressure on US inflation.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10600, "text": "The March increase follows several months of slowing inflation data.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10147, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Michael S. Barr; Michelle W. Bowman; Lisa D. Cook; Philip N. Jefferson; Anna Paulson; and Christopher J. Waller.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10427, "text": "There were no intervention operations in foreign currencies for the System's account during the intermeeting period.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9886, "text": "Inflation remains somewhat elevated.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9272, "text": "Interest rates on credit card accounts edged up a touch in August.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11862, "text": "Employment gains in the fourth quarter of 2025 were largely reversed in the first two months of 2026, and the unemployment rate rose to 6.7% in February.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 9439, "text": "In considering the extent and timing of additional adjustments to the target range for the federal funds rate, the Committee will carefully assess incoming data, the evolving outlook, and the balance of risks.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9835, "text": "Almost all participants observed that while the level of layoffs remained low, hiring remained low as well.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11854, "text": "Financial conditions have tightened from accommodative levels.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10033, "text": "The staff's inflation forecast for this year was slightly higher, on balance, than the one prepared for the January meeting, primarily reflecting incoming data and an expected boost to consumer energy prices given the recent run-up in crude oil prices.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9177, "text": "Higher repo rates induced a fairly rapid increase in the effective federal funds rate (EFFR) relative to the IORB, with signs that the EFFR might increase further.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10639, "text": "The conflict in the Middle East is ongoing and oil prices remain elevated.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9929, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Michael S. Barr; Michelle W. Bowman; Lisa D. Cook; Beth M. Hammack; Philip N. Jefferson; Neel Kashkari; Lorie K. Logan; Anna Paulson; and Christopher J. Waller.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10571, "text": "Inflation remains elevated relative to the Committee's 2 percent goal, in part reflecting supply shocks that have driven price increases in certain sectors, including energy.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9918, "text": "Inflation remains somewhat elevated.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8748, "text": "Issuance of nonfinancial corporate bonds and leveraged loans was solid in June, and private credit continued to be broadly available despite ebbing somewhat in May and June.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8750, "text": "Lending to small businesses remained subdued, an outcome attributed to weak borrower demand.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10257, "text": "Vulnerabilities associated with nonfinancial business and household debt were characterized as moderate.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11865, "text": "CPI inflation eased further to 1.8% in February, down from 2.3% in January.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 9096, "text": "By contrast, if policy rates were kept too high for too long, then unemployment could rise unnecessarily, and the economy could slow sharply.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11745, "text": "The next scheduled date for announcing the overnight rate target is October 29, 2025.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9009, "text": "Interest rates on commercial and industrial (C&I) and short-term business loans remained elevated relative to their post-GFC averages.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10620, "text": "China\u2019s economic growth continues to be supported by strong exports.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11824, "text": "US trade restrictions and uncertainty continue to disrupt growth in Canada.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 8927, "text": "In considering additional adjustments to the target range for the federal funds rate, the Committee will carefully assess incoming data, the evolving outlook, and the balance of risks.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11780, "text": "Governing Council will be assessing incoming data carefully relative to the Bank\u2019s forecast.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9921, "text": "The implications of developments in the Middle East for the U.S. economy are uncertain.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9858, "text": "In their consideration of monetary policy at this meeting, participants noted that inflation had remained somewhat elevated and that available indicators suggested that economic activity had been expanding at a solid pace.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11848, "text": "Economic growth in the United States has moderated but remains solid, driven by consumption and strong AI-related investment.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10591, "text": "After a contraction in the fourth quarter of 2025, growth is forecast to have resumed in early 2026.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11743, "text": "The Bank is focused on ensuring that Canadians continue to have confidence in price stability through this period of global upheaval.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9690, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11759, "text": "Canada\u2019s economy contracted by 1.6% in the second quarter, reflecting a drop in exports and weak business investment amid heightened uncertainty.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10537, "text": "A number of participants noted that it was an opportune time to consider significant changes to the FOMC's postmeeting statement.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11839, "text": "However, uncertainty is heightened and we are monitoring risks closely.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10659, "text": "This differential has contributed to the depreciation of the Canadian dollar.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9908, "text": "Committee organizational documents are available at www.federalreserve.gov/monetarypolicy/rules_authorizations.htm .", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11875, "text": "The Bank is committed to ensuring that Canadians continue to have confidence in price stability through this period of global upheaval.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 8738, "text": "The One Big Beautiful Bill Act, which became law on July 4, ended the previous debt issuance suspension period, after which the TGA balance increased from $313 billion on July 3 to an expected $500 billion by the end of July.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9019, "text": "In the residential mortgage market, credit remained easily available for high-credit-score borrowers who met standard conforming loan criteria but generally tight for low-credit-score borrowers.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10618, "text": "In the United States, economic growth remains solid, supported by consumption and AI\u2011related investment.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9967, "text": "The manager saw this development, together with interdealer repo rates being not much above the standing repo rate that day, as suggesting a greater willingness of at least some counterparties to use the operations when economically sensible following the changes to standing repo operations implemented in December.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10393, "text": "Job gains have kept pace with the workforce, and the unemployment rate has changed little.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11837, "text": "Monetary policy is focused on keeping inflation close to the 2% target while helping the economy through this period of structural adjustment.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10096, "text": "They noted that job gains had remained low and the unemployment rate had been little changed in recent months.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 9695, "text": "The Committee is strongly committed to supporting maximum employment and returning inflation to its 2 percent objective.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11793, "text": "In China, soft domestic demand, including more weakness in the housing market, is weighing on growth.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 9916, "text": "March 18, 2026 Available indicators suggest that economic activity has been expanding at a solid pace.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10632, "text": "The increase reflects energy prices, both higher oil prices and the impact of the elimination of the consumer carbon tax falling out of the 12-month rate of inflation.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10577, "text": "The evolving conflict in the Middle East is causing heightened volatility and US trade policy continues to reshape global trade patterns.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10131, "text": "The Federal Open Market Committee is referenced as the \"FOMC\" and the \"Committee\" in these minutes", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10135, "text": "April 29, 2026 Recent indicators suggest that economic activity has been expanding at a solid pace.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11814, "text": "The outlook for the global and Canadian economies is little changed relative to the projection in the October Monetary Policy Report (MPR).", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11822, "text": "Recent weakness in the US dollar has pushed the Canadian dollar above 72 cents, roughly where it had been since the October MPR.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10050, "text": "Participants generally expected that the effects of tariffs on core goods prices would diminish this year, though they assessed that the pace and timing at which these effects would fade had become more uncertain since the time of the January meeting.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10194, "text": "Finally, the manager observed that the Desk began conducting securities lending operations on FedTrade Plus on April 22, as part of the transition to this new trading platform.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10654, "text": "China\u2019s economy is expanding solidly thanks to robust exports.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10142, "text": "In considering the extent and timing of additional adjustments to the target range for the federal funds rate, the Committee will carefully assess incoming data, the evolving outlook, and the balance of risks.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11802, "text": "CPI inflation slowed to 2.2% in October, as gasoline prices fell and food prices rose more slowly.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11784, "text": "The Bank is focused on ensuring that Canadians continue to have confidence in price stability through this period of global upheaval.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9928, "text": "The Committee's assessments will take into account a wide range of information, including readings on labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11738, "text": "Looking ahead, the disruptive effects of shifts in trade will continue to add costs even as they weigh on economic activity.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10617, "text": "At the same time, the US administration continues to propose new tariffs and trade policy uncertainty remains elevated.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9338, "text": "Regarding the business sector, many participants highlighted strong investment in technology, particularly spending related to AI and data centers.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9058, "text": "Participants noted low net immigration or changes in labor force participation as factors reducing labor supply.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10623, "text": "The Canadian dollar has weakened against the US dollar and other currencies.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11872, "text": "We will continue to assess the impact of US tariffs and trade policy uncertainty, and how the Canadian economy is adjusting.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10649, "text": "Since the April Monetary Policy Report (MPR), global economic prospects have been dented by higher oil prices stemming from the Middle East conflict.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11860, "text": "We continue to expect the Canadian economy to grow modestly as it adjusts to US tariffs and trade policy uncertainty, but recent data suggest that near-term economic growth will be weaker than anticipated in January.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 8706, "text": "Staff Review of the Economic Situation The information available at the time of the meeting indicated that real GDP expanded at a tepid pace in the first half of the year.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10614, "text": "The Bank of Canada today held its target for the overnight rate at 2.25%, with the Bank Rate at 2.5% and the deposit rate at 2.20%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9410, "text": "The Board of Governors of the Federal Reserve System voted unanimously to approve a 1/4 percentage point decrease in the primary credit rate to 4.0 percent, effective October 30, 2025.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11736, "text": "The federal government\u2019s recent decision to remove most retaliatory tariffs on imported goods from the US will mean less upward pressure on the prices of these goods going forward.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10547, "text": "At the conclusion of the discussion, the Committee voted to direct the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the System Open Market Account (SOMA) in accordance with the following domestic policy directive, for release at 2:00 p.m.: \"Effective June 18, 2026, the Federal Open Market Committee directs the Desk to: The vote also encompassed approval of the statement below for release at 2:00 p.m.: \"The Federal Open Market Committee approved the following statement for release by a 12 \u00e2\u0080\u0093 0 vote: The Committee decided to maintain the target range for the federal funds rate at 3-1/2 to 3-3/4 percent, in support of the Federal Reserve's dual mandate.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9922, "text": "The Committee is attentive to the risks to both sides of its dual mandate.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11876, "text": "The next scheduled date for announcing the overnight rate target is April 29, 2026.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8924, "text": "Uncertainty about the economic outlook remains elevated.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10224, "text": "An exception was the Bank of Mexico, which cut its policy rate 25 basis points in late March.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11757, "text": "Global financial conditions have eased further since July and oil prices have been fairly stable.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8699, "text": "Market indicators continued to suggest that reserves remained abundant", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9296, "text": "Hedge fund leverage, on average, remained elevated and increased further, driven by both a shift toward more leveraged strategies and an increase in leverage within strategies.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 9042, "text": "Participants observed that inflation had moved up since the beginning of the year and remained somewhat above the Committee's 2 percent longer-run goal.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9749, "text": "Labor market conditions showed signs of stabilizing following a period of gradual cooling.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10612, "text": "The next scheduled date for announcing the overnight rate target is June 10, 2026.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11773, "text": "Inflation excluding taxes was 2.9%.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11785, "text": "The next scheduled date for announcing the overnight rate target is December 10, 2025.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8846, "text": "In considering the outlook for monetary policy, almost all participants agreed that, with the labor market still solid and current monetary policy moderately or modestly restrictive, the Committee was well positioned to respond in a timely way to potential economic developments.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11864, "text": "It\u2019s too early to assess the impact of the conflict in the Middle East on growth in Canada.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10680, "text": "Uncertainty is still high.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10578, "text": "Both are ongoing sources of uncertainty.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10021, "text": "In the residential mortgage market, the volume of mortgage refinancing increased, but home-purchase borrowing remained subdued.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11716, "text": "After remaining resilient to sharply higher US tariffs and ongoing uncertainty, global economic growth is showing signs of slowing.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 8936, "text": "Implementation Note issued September 17, 2025", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10508, "text": "Many participants remarked that the labor market was not currently a source of inflationary pressures, or that nominal wage growth remained consistent with inflation moving toward 2 percent.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11868, "text": "The sharp increase in global energy prices has led to increases in gasoline prices, and this will push up total inflation in the coming months.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10143, "text": "The Committee is strongly committed to supporting maximum employment and returning inflation to its 2 percent objective.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 8932, "text": "The Committee's assessments will take into account a wide range of information, including readings on labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9446, "text": "Voting against this action were Stephen I. Miran, who preferred to lower the target range for the federal funds rate by 1/2 percentage point at this meeting", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11779, "text": "If the outlook changes, we are prepared to respond.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10485, "text": "The Summary of Economic Projections was released to the public following the conclusion of the meeting.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10394, "text": "Inflation remains elevated relative to the Committee's 2 percent goal, in part reflecting supply shocks that have driven price increases in certain sectors, including energy.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9776, "text": "The one-month option-implied volatility on the S&P 500 index ended the period roughly unchanged at a moderate level by historical standards.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11820, "text": "Overall, the Bank expects global growth to average about 3% over the projection horizon.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10217, "text": "Economic activity abroad appeared to have expanded at a moderate pace in the first quarter.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9646, "text": "All members agreed that the postmeeting statement should relay this judgment about additional rate adjustments and that it also should affirm their strong commitment both to supporting maximum employment and to returning inflation to the Committee's 2 percent objective.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9155, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9980, "text": "Total consumer price inflation\u00e2\u0080\u0094as measured by the 12-month change in the personal consumption expenditures (PCE) price index\u00e2\u0080\u0094was 2.8 percent in January.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10574, "text": "For media inquiries, please email [email protected] or call 202-452-2955.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10077, "text": "Participants agreed that uncertainty about the economic outlook remained elevated and that the conflict in the Middle East was an additional source of uncertainty.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9147, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9920, "text": "Uncertainty about the economic outlook remains elevated.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9485, "text": "Given the importance of standing repo operations for monetary policy implementation, the manager proposed to clarify their intended role in official communications, convey the expectation that they would be used when economically sensible, and eliminate their aggregate limit.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11794, "text": "Global financial conditions, oil prices, and the Canadian dollar are all roughly unchanged since the Bank\u2019s October Monetary Policy Report (MPR).", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10095, "text": "Committee Policy Actions In their discussions of monetary policy for this meeting, members agreed that available indicators suggested that economic activity had been expanding at a solid pace.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9877, "text": "In support of its goals, almost all members decided t
