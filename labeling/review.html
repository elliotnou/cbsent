ED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6120, "text": "Beginning in June, the Committee will slow the pace of decline of its securities holdings by reducing the monthly redemption cap on Treasury securities from $60 billion to $25 billion.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7031, "text": "Almost all participants expressed greater confidence that inflation was moving sustainably toward 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11055, "text": "Overall, the latest data remains in line with the Bank\u2019s expectation that CPI inflation will come down to around 3% in the middle of this year.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11145, "text": "Moreover, with three-month rates of core inflation running around 3\u00bd-4% since last September, underlying price pressures appear to be more persistent than anticipated.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4599, "text": "Survey respondents anticipated that both headline and core personal consumption expenditures (PCE) inflation will decline to 2 percent by the end of 2025.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11411, "text": "As expected, inflation slowed further to 2.5% in July.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10898, "text": "More than half of the components that make up the CPI are now rising by more than 5%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 470, "text": "Financing conditions for consumer credit remained accommodative for most borrowers, especially those with stronger credit scores.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10880, "text": "This is dampening the outlook, particularly in Europe.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 625, "text": "December 15, 2021 The Federal Reserve is committed to using its full range of tools to support the U.S. economy in this challenging time, thereby promoting its maximum employment and price stability goals.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7886, "text": "Beginning in April, the Committee will slow the pace of decline of its securities holdings by reducing the monthly redemption cap on Treasury securities from $25 billion to $5 billion.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 982, "text": "Beginning in February, the Committee will increase its holdings of Treasury securities by at least $20 billion per month and of agency mortgage\u00e2\u0080\u0091backed securities by at least $10 billion per month.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11050, "text": "Wages continue to grow at 4% to 5%, while productivity has declined in recent quarters.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11621, "text": "How much upward pressure this puts on inflation will depend on the evolution of tariffs and how quickly businesses pass on higher costs to consumers.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10797, "text": "At that time, the Governing Council will consider exiting the reinvestment phase and reducing the size of its balance sheet by allowing roll-off of maturing Government of Canada bonds.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 1649, "text": "The unemployment rate had fallen to a post-pandemic low, and quits and job openings were at all-time highs.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 2512, "text": "In some Districts, contacts had suggested that labor demand\u00e2\u0080\u0093supply imbalances might be diminishing, with firms being more successful in hiring and retaining workers and under less pressure to raise wages.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 6655, "text": "Staff Review of the Economic Situation The information available at the time of the meeting indicated that U.S. economic activity had advanced solidly so far this year, but at a markedly slower pace than in the second half of 2023.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11697, "text": "This largely reflects an increase in non-energy goods prices.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6109, "text": "May 01, 2024 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11120, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1750, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 330, "text": "Inflation is elevated, largely reflecting factors that are expected to be transitory.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11431, "text": "Consumption has continued to grow but is declining on a per person basis.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6833, "text": "Members agreed that to appropriately reflect developments since the previous meeting related to their maximum-employment objective, they should note in the statement that \"job gains have moderated, and the unemployment rate has moved up but remains low.\" Similarly, to appropriately reflect developments related to their price-stability objective, they agreed to note that \"there has been some further progress toward the Committee's 2 percent inflation objective.\" Members also agreed to reflect the shifting balance of risks by stating that \"the Committee judges that the risks to achieving its employment and inflation goals continue to move into better balance\" and that \"the Committee is attentive to the risks to both sides of its dual mandate.\" At the conclusion of the discussion, the Committee voted to direct the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the System Open Market Account in accordance with the following domestic policy directive, for release at 2:00 p.m.: \"Effective August 1, 2024, the Federal Open Market Committee directs the Desk to: The vote also encompassed approval of the statement below for release at 2:00 p.m.: \"Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2532, "text": "There were, however, some signs of gradual improvement in the supply situation\u00e2\u0080\u0094including improved availability of certain key materials, less upward pressure on input prices, and a decline in delivery times.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11454, "text": "If the economy evolves broadly in line with our latest forecast, we expect to reduce the policy rate further.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11308, "text": "Inflation rates are projected to reach central bank targets in 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11290, "text": "Underlying inflationary pressures persist: year-over-year and three-month measures of core inflation are in the 3% to 3.5% range, and the share of CPI components growing above 3% declined but is still above the historical average.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4131, "text": "Banks of all sizes expected to tighten C&I standards further over the remainder of the year, with small and mid-sized banks more widely reporting this expectation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 2894, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10801, "text": "The Bank is continuing its reinvestment phase, keeping its overall holdings of Government of Canada bonds on its balance sheet roughly constant until such time as it becomes appropriate to allow the size of its balance sheet to decline.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11072, "text": "US growth is expected to slow considerably in the coming months, with particular weakness in sectors that are important for Canadian exports.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 207, "text": "After a rapid pace of almost 1 million per month in June and July, job gains slowed to 235,000 in August as the resurgence of COVID-19 cases weighed on employment in high-contact service sectors, particularly in the leisure and hospitality sector.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 974, "text": "Overall financial conditions remain accommodative, in part reflecting policy measures to support the economy and the flow of credit to U.S. households and businesses.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 6816, "text": "A couple participants highlighted in particular the costs and challenges of addressing such a weakening once it is fully under way.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5, "text": "Overall financial conditions remain accommodative, in part reflecting policy measures to support the economy and the flow of credit to U.S. households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 11062, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10904, "text": "In the United States, high inflation and rising interest rates are contributing to a slowdown in domestic demand.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 170, "text": "relative to the July projection, these supply constraints were also expected to take longer to resolve.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10698, "text": "CPI inflation remains above 3 percent as expected, boosted by base-year effects, gasoline prices, and pandemic-related supply bottlenecks.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2148, "text": "Implied equity price volatility remained at elevated levels.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10890, "text": "The policy interest rate remains the Bank\u2019s primary monetary policy instrument, with quantitative tightening acting as a complementary tool.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 3189, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6380, "text": "The Committee does not expect it will be appropriate to reduce the target range until it has gained greater confidence that inflation is moving sustainably toward 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11302, "text": "US GDP growth is expected to slow in the second half of this year, but remain stronger than forecast in January.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11611, "text": "In Canada, the economy is slowing as tariff announcements and uncertainty pull down consumer and business confidence.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 1944, "text": "A few participants noted that there were signs that the pandemic-related factors that had held back labor supply might be abating further, especially in the case of prime-age workers.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11359, "text": "The Bank of Canada today reduced its target for the overnight rate to 4\u00bd%, with the Bank Rate at 4\u00be% and the deposit rate at 4\u00bd%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7037, "text": "They also emphasized that such a move would help sustain the strength in the economy and the labor market while continuing to promote progress on inflation, and would reflect the balance of risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6458, "text": "Broad stock price indexes increased substantially, on net, amid a positive investor outlook on corporate profits and economic activity.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11580, "text": "The temporary suspension of the GST/HST lowered some consumer prices, but January\u2019s CPI was slightly firmer than expected at 1.9%.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4837, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1893, "text": "The staff noted that increased uncertainty and ongoing volatility had reduced risk appetite in financial markets and eased price pressures, although valuations of many assets remained elevated.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11137, "text": "In the labour market, there are signs of more availability of workers, but conditions remain tight, and wage growth has been around 4-5%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 4472, "text": "Participants generally continued to judge that a tightening in credit conditions spurred by banking-sector stress earlier in the year would likely weigh further on economic activity, but the extent remained uncertain.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5070, "text": "November 01, 2023 Recent indicators suggest that economic activity expanded at a strong pace in the third quarter.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11492, "text": "1 The Bank is also announcing its plan to complete the normalization of its balance sheet, ending quantitative tightening.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10771, "text": "With overall economic slack now absorbed, the Bank has removed its exceptional forward guidance on its policy interest rate.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11484, "text": "With inflation around 2%, the economy in excess supply, and recent indicators tilted towards softer growth than projected, Governing Council decided to reduce the policy rate by a further 50 basis points to support growth and keep inflation close to the middle of the 1-3% target range.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 7430, "text": "In China, inflation remained close to zero, in part due to falling food prices.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6111, "text": "Inflation has eased over the past year but remains elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10926, "text": "The Bank of Canada today increased its target for the overnight rate to 3\u00bc%, with the Bank Rate at 3\u00bd% and the deposit rate at 3\u00bc%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7114, "text": "The rise at short maturities reflected increases in both real yields and inflation compensation, while the rise at longer maturities was primarily driven by increases in real yields.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 7441, "text": "Many foreign central banks eased their policy rates during the intermeeting period, including the Bank of Canada, the European Central Bank, and the Swiss National Bank, among the AFEs, and the central banks of Hong Kong, India, Korea, and Mexico, among the emerging market economies.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10853, "text": "Housing market activity, which has been exceptionally high, is expected to moderate.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 507, "text": "Participants noted that the underlying conditions supporting growth in demand remained strong and that, as the number of COVID-19 cases remained well below the summer's levels, growth in economic activity would likely show a pickup in the fourth quarter.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5557, "text": "In determining the extent of any additional policy firming that may be appropriate to return inflation to 2 percent over time, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10747, "text": "The new Omicron COVID-19 variant has prompted a tightening of travel restrictions in many countries and a decline in oil prices, and has injected renewed uncertainty.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11162, "text": "In the United States, growth was stronger than expected, led by robust consumer spending.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8600, "text": "Most participants assessed that some reduction in the target range for the federal funds rate this year would likely be appropriate, noting that upward pressure on inflation from tariffs may be temporary or modest, that medium- and longer-term inflation expectations had remained well anchored, or that some weakening of economic activity and labor market conditions could occur.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 237, "text": "A few participants commented that there were also some downside risks for inflation, as the factors that had held inflation down over the previous long expansion were likely still in place.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11174, "text": "With the recent increase in gasoline prices, CPI inflation is expected to be higher in the near term before easing again.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10852, "text": "Exports and business investment will continue to recover, supported by strong foreign demand and high commodity prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11102, "text": "Economic growth has essentially stalled in Europe but upward pressure on core prices is persisting.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 39, "text": "Expectations for the target federal funds rate based on survey responses and interest rate futures moved up slightly since the previous meeting.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6110, "text": "Job gains have remained strong, and the unemployment rate has remained low.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11402, "text": "Inflation in both regions continues to moderate.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 2803, "text": "A few participants particularly stressed the high uncertainty associated with the expected future path of the unemployment rate and commented that the unemployment rate could rise by considerably more than in the staff forecast.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 640, "text": "The Federal Reserve's ongoing purchases and holdings of securities will continue to foster smooth market functioning and accommodative financial conditions, thereby supporting the flow of credit to households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 4638, "text": "Staff Review of the Financial Situation Over the intermeeting period, market participants interpreted domestic economic data releases as indicating continued resilience of economic activity and some easing of inflationary pressures, and they viewed monetary policy communications as pointing to somewhat more restrictive policy than expected.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7478, "text": "The risks around the inflation forecast were seen as tilted to the upside, as core inflation had not come down as much as expected in 2024 and the effects of trade policy changes could be larger than the staff had assumed.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4218, "text": "Some participants remarked that a further easing in labor market conditions would be needed to help bring down inflation in this component.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11160, "text": "Global growth slowed in the second quarter of 2023, largely reflecting a significant deceleration in China.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6622, "text": "The Committee does not expect it will be appropriate to reduce the target range until it has gained greater confidence that inflation is moving sustainably toward 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10836, "text": "Price spikes in oil, natural gas and other commodities are adding to inflation around the world.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11572, "text": "However, economic growth in the first quarter of 2025 will likely slow as the intensifying trade conflict weighs on sentiment and activity.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11491, "text": "The Bank of Canada today reduced its target for the overnight rate to 3%, with the Bank Rate at 3.25% and the deposit rate at 2.95%.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 328, "text": "With progress on vaccinations and strong policy support, indicators of economic activity and employment have continued to strengthen.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10999, "text": "Governing Council continues to assess how tighter monetary policy is working to slow demand, how supply challenges are resolving, and how inflation and inflation expectations are responding.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11419, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11656, "text": "CPI inflation eased to 1.7% in April, as the elimination of the federal consumer carbon tax reduced inflation by 0.6 percentage points.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5406, "text": "Staff Review of the Financial Situation Over the intermeeting period, some softer-than-expected data releases appeared to lessen the perception among investors that policy may need to tighten further in order to bring inflation down to 2 percent over time.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11310, "text": "A broad range of indicators suggest that labour market conditions continue to ease.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11398, "text": "The Bank is continuing its policy of balance sheet normalization.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10786, "text": "Economic growth is then expected to bounce back and remain robust over the projection horizon, led by consumer spending on services, and supported by strength in exports and business investment.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6513, "text": "In particular, a few participants emphasized that nominal wage growth, though still above rates consistent with price stability, had declined, notably in labor-intensive sectors.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10803, "text": "Prices for oil and other commodities have risen sharply.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 12, "text": "Last December, the Committee indicated that it would continue to increase its holdings of Treasury securities by at least $80 billion per month and of agency mortgage\u00e2\u0080\u0091backed securities by at least $40 billion per month until substantial further progress has been made toward its maximum employment and price stability goals.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 2199, "text": "In addition, participants indicated that COVID-related lockdowns in China were likely to exacerbate supply chain disruptions.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11391, "text": "At the same time, price pressures in some important parts of the economy\u2014notably shelter and some other services\u2014are holding inflation up.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5071, "text": "Job gains have moderated since earlier in the year but remain strong, and the unemployment rate has remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 3257, "text": "In response to high inflation, many central banks further tightened monetary policy, albeit at a slower pace in some cases.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2637, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11523, "text": "The cumulative reduction in the policy rate since last June is substantial.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 4583, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11499, "text": "In China, recent policy actions are boosting demand and supporting near-term growth, although structural challenges remain.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5330, "text": "December 13, 2023 Recent indicators suggest that growth of economic activity has slowed from its strong pace in the third quarter.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11004, "text": "The Bank of Canada today increased its target for the overnight rate to 4\u00bd%, with the Bank Rate at 4\u00be% and the deposit rate at 4\u00bd%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6307, "text": "Participants judged that balance sheet reduction had proceeded smoothly.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11189, "text": "Growth in the euro area has slowed further.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5387, "text": "both total and core PCE inflation were well below their year-earlier levels.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 5944, "text": "January's readings on orders and shipments of nondefense capital goods excluding aircraft and on nonresidential construction spending suggested some deceleration in business fixed investment.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11698, "text": "High shelter price inflation remains the main contributor to overall inflation, but it continues to ease.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11094, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10860, "text": "It is then expected to ease to about 2\u00bd% in the second half of 2023 and return to the 2% target in 2024.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 7382, "text": "This shift mainly reflected revisions to estimates by respondents who had expected balance sheet runoff to end in the last quarter of 2024 or in early 2025.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 7705, "text": "Many foreign central banks eased policy during the intermeeting period, including the Bank of Canada, the European Central Bank, and the Swiss National Bank among the AFEs, and the central banks of Colombia, Indonesia, and Mexico among the emerging market economies (EMEs).", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 5399, "text": "Foreign economic growth slowed in the third quarter, and available indicators pointed to subdued growth in the fourth quarter.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11644, "text": "China\u2019s economy has slowed as the effects of past fiscal support fade.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 1430, "text": "March 16, 2022 Indicators of economic activity and employment have continued to strengthen.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10734, "text": "We remain committed to holding the policy interest rate at the effective lower bound until economic slack is absorbed so that the 2 percent inflation target is sustainably achieved.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10687, "text": "This is reinforced and supplemented by the Bank\u2019s quantitative easing (QE) program, which is being maintained at a target pace of $2 billion per week.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10765, "text": "We remain committed to holding the policy interest rate at the effective lower bound until economic slack is absorbed so that the 2 percent inflation target is sustainably achieved.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10703, "text": "We remain committed to holding the policy interest rate at the effective lower bound until economic slack is absorbed so that the 2 percent inflation target is sustainably achieved.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10758, "text": "CPI inflation is elevated and the impact of global supply constraints is feeding through to a broader range of goods prices.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10729, "text": "The recent increase in CPI inflation was anticipated in July, but the main forces pushing up prices \u2013 higher energy prices and pandemic-related supply bottlenecks \u2013 now appear to be stronger and more persistent than expected.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10746, "text": "Inflation has increased further in many countries, reflecting strong demand for goods amid ongoing supply disruptions.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10755, "text": "Job vacancies remain elevated and wage growth has also picked up.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10744, "text": "The global economy continues to recover from the effects of the COVID-19 pandemic.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10721, "text": "This has significantly reduced the very uneven impact of the pandemic on workers.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10726, "text": "Housing activity has moderated, but is expected to remain elevated.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10759, "text": "The effects of these constraints on prices will likely take some time to work their way through, given existing supply backlogs.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10711, "text": "The Bank\u2019s extraordinary forward guidance on the path for the overnight rate is being maintained.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10743, "text": "The Bank is continuing its reinvestment phase, keeping its overall holdings of Government of Canada bonds roughly constant.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10708, "text": "The next scheduled date for announcing the overnight rate target is October 27, 2021.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10697, "text": "The Bank continues to expect the economy to strengthen in the second half of 2021, although the fourth wave of COVID-19 infections and ongoing supply bottlenecks could weigh on the recovery.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10768, "text": "The next scheduled date for announcing the overnight rate target is January 26, 2022.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10724, "text": "The Bank now forecasts Canada\u2019s economy will grow by 5 percent this year before moderating to 4\u00bc percent in 2022 and 3\u00be percent in 2023.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10699, "text": "These factors pushing up inflation are expected to be transitory, but their persistence and magnitude are uncertain and will be monitored closely.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10713, "text": "The global economic recovery from the COVID-19 pandemic is progressing.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10741, "text": "The Bank of Canada today held its target for the overnight rate at the effective lower bound of \u00bc percent, with the Bank Rate at \u00bd percent and the deposit rate at \u00bc percent.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10749, "text": "Canada\u2019s economy grew by about 5\u00bd percent in the third quarter, as expected.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10738, "text": "A market notice outlining details of the reinvestment phase will be published on the Bank\u2019s web site at 10:30 am ET today.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10790, "text": "As supply shortages diminish, inflation is expected to decline reasonably quickly to about 3% by the end of this year and then gradually ease towards the target over the projection period.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10919, "text": "The July outlook has inflation starting to come back down later this year, easing to about 3% by the end of next year and returning to the 2% target by the end of 2024.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10918, "text": "Global energy prices are also projected to decline.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10964, "text": "In Canada, the economy continues to operate in excess demand and labour markets remain tight.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10927, "text": "The Bank is also continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10922, "text": "Quantitative tightening continues and is complementing increases in the policy interest rate.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10838, "text": "These factors are the primary drivers of a substantial upward revision to the Bank\u2019s outlook for inflation in Canada.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10998, "text": "Looking ahead, Governing Council will be considering whether the policy interest rate needs to rise further to bring supply and demand back into balance and return inflation to target.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10993, "text": "CPI inflation remained at 6.9% in October, with many of the goods and services Canadians regularly buy showing large price increases.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10884, "text": "Canadian economic activity is strong and the economy is clearly operating in excess demand.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 10855, "text": "Robust business investment, labour productivity growth and higher immigration will add to the economy\u2019s productive capacity, while higher interest rates should moderate growth in domestic demand.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 10956, "text": "Tighter monetary policies aimed at controlling inflation are weighing on economic activity around the world.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 10952, "text": "The Bank is also continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10901, "text": "If that occurs, the economic cost of restoring price stability will be higher.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10895, "text": "The Bank is also continuing its policy of quantitative tightening (QT).", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10902, "text": "Global inflation is higher, reflecting the impact of the Russian invasion of Ukraine, ongoing supply constraints, and strong demand.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10939, "text": "The longer this continues, the greater the risk that elevated inflation becomes entrenched.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10848, "text": "Businesses increasingly report they are having difficulty meeting demand, and are able to pass on higher input costs by increasing prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10883, "text": "Global financial conditions have tightened and markets have been volatile.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10925, "text": "The Bank will publish its next full outlook for the economy and inflation, including risks to the projection, in the MPR on October 26, 2022.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10950, "text": "The Bank will publish its next full outlook for the economy and inflation, including risks to the projection, in the MPR at the same time.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10914, "text": "Growth is expected to slow to about 2% in the third quarter as consumption growth moderates and housing market activity pulls back following unsustainable strength during the pandemic.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10934, "text": "Commodity prices have been volatile: oil, wheat and lumber prices have moderated while natural gas prices have risen.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10982, "text": "The Bank will publish its next full outlook for the economy and inflation, including risks to the projection, in the MPR on January 25, 2023.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10981, "text": "The next scheduled date for announcing the overnight rate target is December 7, 2022.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10791, "text": "Near-term inflation expectations have moved up, but longer-run expectations remain anchored on the 2% target.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10867, "text": "The Bank will publish its next full outlook for the economy and inflation, including risks to the projection, in the MPR on July 13, 2022.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10928, "text": "The global and Canadian economies are evolving broadly in line with the Bank\u2019s July projection.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10785, "text": "While its economic impact will depend on how quickly this wave passes, it is expected to be less severe than previous waves.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10810, "text": "Global supply bottlenecks remain challenging, although there are indications that some constraints have eased.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10808, "text": "Economies are emerging from the impact of the Omicron variant of COVID-19 more quickly than expected, although the virus continues to circulate and the possibility of new variants remains a concern.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10778, "text": "Overall, the Bank projects global GDP growth to moderate from 6\u00be % in 2021 to about 3\u00bd % in 2022 and 2023.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10825, "text": "The policy rate is the Bank\u2019s primary monetary policy instrument.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11231, "text": "The labour market continues to ease: job creation has been slower than labour force growth, job vacancies have declined further, and the unemployment rate has risen modestly.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11224, "text": "Oil prices are about $10-per-barrel lower than was assumed in the October Monetary Policy Report (MPR).", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11114, "text": "The Bank continues to expect CPI inflation to ease to around 3% in the summer, as lower energy prices feed through and last year\u2019s large price gains fall out of the yearly data.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11167, "text": "This reflected a marked weakening in consumption growth and a decline in housing activity, as well as the impact of wildfires in many regions of the country.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11125, "text": "Global inflation is easing, with lower energy prices and a decline in goods price inflation.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11045, "text": "In Canada, economic growth came in flat in the fourth quarter of 2022, lower than the Bank projected.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11221, "text": "The global economy continues to slow and inflation has eased further.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11053, "text": "With weak economic growth for the next couple of quarters, pressures in product and labour markets are expected to ease.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11194, "text": "Consumption has been subdued, with softer demand for housing, durable goods and many services.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11166, "text": "Economic growth slowed sharply in the second quarter of 2023, with output contracting by 0.2% at an annualized rate.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11128, "text": "After a surge in early 2023, China\u2019s economic growth is softening, with slowing exports and ongoing weakness in its property sector.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11190, "text": "Inflation has been easing in most economies, as supply bottlenecks resolve and weaker demand relieves price pressures.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11240, "text": "Governing Council wants to see further and sustained easing in core inflation, and continues to focus on the balance between demand and supply in the economy, inflation expectations, wage growth, and corporate pricing behaviour.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11082, "text": "Softening foreign demand is expected to restrain exports and business investment.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11019, "text": "Meanwhile, weaker foreign demand will likely weigh on exports.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11070, "text": "Growth in the United States and Europe has surprised on the upside, but is expected to weaken as tighter monetary policy continues to feed through those economies.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11061, "text": "Governing Council will continue to assess economic developments and the impact of past interest rate increases, and is prepared to increase the policy rate further if needed to return inflation to the 2% target.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11009, "text": "China\u2019s abrupt lifting of COVID-19 restrictions has prompted an upward revision to the growth forecast for China and poses an upside risk to commodity prices.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11066, "text": "The Bank is also continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11026, "text": "Short-term inflation expectations remain elevated.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11005, "text": "The Bank is also continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11117, "text": "Quantitative tightening is complementing the restrictive stance of monetary policy and normalizing the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11025, "text": "Despite this progress, Canadians are still feeling the hardship of high inflation in their essential household expenses, with persistent price increases for food and shelter.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11222, "text": "In the United States, growth has been stronger than expected, led by robust consumer spending, but is likely to weaken in the months ahead as past policy rate increases work their way through the economy.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11116, "text": "Based on the accumulation of evidence, Governing Council decided to increase the policy interest rate, reflecting our view that monetary policy was not sufficiently restrictive to bring supply and demand back into balance and return inflation sustainably to the 2% target.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11151, "text": "Quantitative tightening is complementing the restrictive stance of monetary policy and normalizing the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11089, "text": "However, getting inflation the rest of the way back to 2% could prove to be more difficult because inflation expectations are coming down slowly, service price inflation and wage growth remain elevated, and corporate pricing behaviour has yet to normalize.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11220, "text": "The Bank is continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11132, "text": "Canada\u2019s economy has been stronger than expected, with more momentum in demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11052, "text": "Price increases for food and shelter remain high, causing continued hardship for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11023, "text": "The Bank expects GDP growth of about 1% in 2023 and about 2% in 2024, little changed from the October outlook.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11205, "text": "CPI inflation has been volatile in recent months\u20142.8% in June, 4.0% in August, and 3.8% in September.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11187, "text": "The Bank projects global GDP growth of 2.9% this year, 2.3% in 2024 and 2.6% in 2025.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11011, "text": "Financial conditions remain restrictive but have eased since October, and the Canadian dollar has been relatively stable against the US dollar.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11074, "text": "Overall, commodity prices are close to their January levels.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11008, "text": "In the United States and Europe, economies are slowing but proving more resilient than was expected at the time of the Bank\u2019s October Monetary Policy Report (MPR).", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11036, "text": "The Bank of Canada today held its target for the overnight rate at 4\u00bd%, with the Bank Rate at 4\u00be% and the deposit rate at 4\u00bd%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11034, "text": "The next scheduled date for announcing the overnight rate target is March 8, 2023.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11204, "text": "Overall, the Bank expects the Canadian economy to grow by 1.2% this year, 0.9% in 2024 and 2.5% in 2025.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11119, "text": "In particular, we will be evaluating whether the evolution of excess demand, inflation expectations, wage growth and corporate pricing behaviour are consistent with achieving the inflation target.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11063, "text": "The next scheduled date for announcing the overnight rate target is April 12, 2023.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11180, "text": "In particular, we will be evaluating whether the evolution of excess demand, inflation expectations, wage growth and corporate pricing behavior are consistent with achieving the 2% inflation target.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11186, "text": "The global economy is slowing and growth is forecast to moderate further as past increases in policy rates and the recent surge in global bond yields weigh on demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11217, "text": "The next scheduled date for announcing the overnight rate target is December 6, 2023.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11226, "text": "The US dollar has weakened against most currencies, including Canada\u2019s.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11364, "text": "US inflation looks to have resumed its downward path.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11465, "text": "In the euro area, recent indicators point to weaker growth.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11346, "text": "Wage pressures remain but look to be moderating gradually.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11382, "text": "Broad inflationary pressures are easing.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11433, "text": "The labour market remains soft\u2014the unemployment rate was at 6.5% in September.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11321, "text": "CPI inflation slowed to 2.8% in February, with easing in price pressures becoming more broad-based across goods and services.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11294, "text": "Governing Council wants to see further and sustained easing in core inflation and continues to focus on the balance between demand and supply in the economy, inflation expectations, wage growth, and corporate pricing behaviour.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11249, "text": "In China, low consumer confidence and policy uncertainty will likely restrain activity.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11438, "text": "GDP growth is forecast to strengthen gradually over the projection horizon, supported by lower interest rates.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11265, "text": "The Bank expects inflation to remain close to 3% during the first half of this year before gradually easing, returning to the 2% target in 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11269, "text": "Governing Council wants to see further and sustained easing in core inflation and continues to focus on the balance between demand and supply in the economy, inflation expectations, wage growth, and corporate pricing behaviour.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11312, "text": "There are some recent signs that wage pressures are moderating.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11256, "text": "With weak growth, supply has caught up with demand and the economy now looks to be operating in modest excess supply.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11349, "text": "The Bank\u2019s preferred measures of core inflation also slowed and three-month measures suggest continued downward momentum.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11427, "text": "Inflation in advanced economies has declined in recent months, and is now around central bank targets.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11436, "text": "Wage growth remains elevated relative to productivity growth.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11351, "text": "However, shelter price inflation remains high.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11410, "text": "Wage growth, however, remains elevated relative to productivity.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11414, "text": "Inflation also remains elevated in some other services.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11245, "text": "The Bank is continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11322, "text": "However, shelter price inflation is still very elevated, driven by growth in rent and mortgage interest costs.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11299, "text": "The Bank is continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11384, "text": "Shelter price inflation remains high, driven by rent and mortgage interest costs, and is still the biggest contributor to total inflation.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11463, "text": "In the United States, the economy continues to show broad-based strength, with robust consumption and a solid labour market.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11289, "text": "Shelter price inflation remains elevated and is the biggest contributor to inflation.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11281, "text": "Global oil prices are slightly higher than what was assumed in the January Monetary Policy Report (MPR).", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11274, "text": "The Bank is continuing its policy of quantitative tightening.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11301, "text": "The US economy has again proven stronger than anticipated, buoyed by resilient consumption and robust business and government spending.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11304, "text": "Global oil prices have moved up, averaging about $5 higher than assumed in the January Monetary Policy Report (MPR).", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11487, "text": "Our decisions will be guided by incoming information and our assessment of the implications for the inflation outlook.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11425, "text": "Growth in the United States is now expected to be stronger than previously forecast while the outlook for China remains subdued.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11479, "text": "In addition, the possibility the incoming US administration will impose new tariffs on Canadian exports to the United States has increased uncertainty and clouded the economic outlook.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11378, "text": "With new government limits on admissions of non-permanent residents, population growth should slow in 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11244, "text": "The Bank of Canada today held its target for the overnight rate at 5%, with the Bank Rate at 5\u00bc% and the deposit rate at 5%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11306, "text": "The Bank has revised up its forecast for global GDP growth to 2\u00be% in 2024 and about 3% in 2025 and 2026.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11330, "text": "The next scheduled date for announcing the overnight rate target is June 5, 2024.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11464, "text": "US inflation has been holding steady, with some price pressures persisting.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11399, "text": "The global economy expanded by about 2\u00bd% in the second quarter, consistent with projections in the Bank\u2019s July Monetary Policy Report (MPR).", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11252, "text": "The Bank now forecasts global GDP growth of 2\u00bd% in 2024 and 2\u00be% in 2025, following 2023\u2019s 3% pace.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11432, "text": "Exports have been boosted by the opening of the Trans Mountain Expansion pipeline.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11392, "text": "Governing Council is carefully assessing these opposing forces on inflation.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11377, "text": "Residential investment is expected to grow robustly.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11483, "text": "Measures of core inflation will help us assess the trend in CPI inflation.
