fts sales and spending on renovations.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7436, "text": "Broad equity prices rose, with more pronounced increases in stock prices in cyclical sectors amid increased investor optimism for corporate profits, and high-yield bond spreads narrowed.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11348, "text": "CPI inflation eased further in April, to 2.7%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11360, "text": "The Bank is continuing its policy of balance sheet normalization.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8310, "text": "Several participants highlighted factors that might help mitigate the magnitude and persistence of potential increases in inflation, such as reductions of tariff increases from ongoing trade negotiations, less tolerance for price increases by households, a weakening of the economy, reduced housing inflation pressures from lower immigration, or a desire by some firms to increase market share rather than raise prices on items not affected by tariffs.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10917, "text": "This, combined with the resolution of supply disruptions, will bring demand and supply back into balance and alleviate inflationary pressures.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 6445, "text": "In emerging market economies (EMEs), including China, growth was supported by strong external demand.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6941, "text": "Market-based measures of interest rate uncertainty in the near term rose notably, reportedly reflecting in part increased concerns among investors about downside risks to economic activity.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 4577, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1825, "text": "The labor force participation rate increased in March, as did the employment-to-population ratio.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11573, "text": "Recent surveys suggest a sharp drop in consumer confidence and a slowdown in business spending as companies postpone or cancel investments.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11416, "text": "Excess supply in the economy continues to put downward pressure on inflation, while price increases in shelter and some other services are holding inflation up.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10688, "text": "The global economic recovery continued through the second quarter, led by strong US growth, and had solid momentum heading into the third quarter.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11507, "text": "However, business investment remains weak.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11666, "text": "how much and how quickly cost increases are passed on to consumer prices; and how inflation expectations evolve.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5381, "text": "The labor force participation rate was essentially flat over the past two months, remaining above its level early in the year, while the employment-to-population ratio rose slightly on balance.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 970, "text": "January 26, 2022 Indicators of economic activity and employment have continued to strengthen.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11181, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10772, "text": "The Bank is continuing its reinvestment phase, keeping its overall holdings of Government of Canada bonds roughly constant.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11380, "text": "The strengthening economy will gradually absorb excess supply through 2025 and into 2026.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11475, "text": "Reductions in targeted immigration levels suggest GDP growth next year will be below the Bank\u2019s October forecast.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11237, "text": "In recent months, the Bank\u2019s preferred measures of core inflation have been around 3\u00bd-4%, with the October data coming in towards the lower end of this range.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11426, "text": "Growth in the euro area has been soft but should recover modestly next year.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5949, "text": "In contrast to strong U.S. GDP growth in the fourth quarter, economic growth in foreign economies was generally weak amid tight monetary policy, the erosion in real household incomes from high inflation, and the ongoing repercussions of the 2022 energy shock in Europe.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11472, "text": "The unemployment rate rose to 6.8% in November as employment continued to grow more slowly than the labour force.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 3361, "text": "With the labor force participation rate little changed since the beginning of 2022, some participants commented that labor supply appeared to be constrained by structural factors such as early retirements, reduced availability or increased cost of childcare, more costly transportation, and reduced immigration.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 5906, "text": "The vast majority of participants thus judged it would be prudent to begin slowing the pace of runoff fairly soon.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10784, "text": "The Omicron variant is weighing on activity in the first quarter.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11154, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 101, "text": "In the advanced foreign economies (AFEs), where high vaccination rates had increased resilience to COVID-19 outbreaks, incoming data were consistent with economic growth in the third quarter at a slightly faster pace than in the second quarter.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11316, "text": "The contribution to growth from spending by governments has also increased.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4742, "text": "Participants also observed, however, that although growth in payrolls had slowed recently, it continued to exceed values consistent over time with an unchanged unemployment rate, and that nominal wages were still rising at rates above levels assessed to be consistent with the sustained achievement of the Committee's 2 percent inflation objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8405, "text": "The unemployment rate remains low, and labor market conditions remain solid.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10903, "text": "Many central banks are tightening monetary policy to combat inflation, and the resulting tighter financial conditions are moderating economic growth.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10763, "text": "The Bank is closely watching inflation expectations and labour costs to ensure that the forces pushing up prices do not become embedded in ongoing inflation.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11643, "text": "In Europe, economic growth has been supported by exports, while defence spending is set to increase.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10712, "text": "The Bank is ending quantitative easing (QE) and moving into the reinvestment phase, during which it will purchase Government of Canada bonds solely to replace maturing bonds.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 340, "text": "In light of the substantial further progress the economy has made toward the Committee's goals since last December, the Committee decided to begin reducing the monthly pace of its net asset purchases by $10 billion for Treasury securities and $5 billion for agency mortgage-backed securities.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10899, "text": "With this broadening of price pressures, the Bank\u2019s core measures of inflation have moved up to between 3.9% and 5.4%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5910, "text": "Slower runoff would give the Committee more time to assess market conditions as the balance sheet continues to shrink.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 4183, "text": "Against this background, participants concurred that they remained highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7808, "text": "In particular, participants cited the possible effects of potential changes in trade and immigration policy, the potential for geopolitical developments to disrupt supply chains, or stronger-than-expected household spending.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10834, "text": "Maturing Government of Canada bonds on the Bank\u2019s balance sheet will no longer be replaced and, as a result, the size of the balance sheet will decline over time.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11142, "text": "Inflation in Canada eased to 3.4% in May, a substantial and welcome drop from its peak of 8.1% last summer.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6439, "text": "Recent spending indicators suggested that GDP and PDFP were increasing at solid rates in the second quarter.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4963, "text": "Some participants noted that housing demand was resilient despite higher interest rates", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11209, "text": "Near-term inflation expectations and corporate pricing behaviour are normalizing only gradually, and wages are still growing around 4% to 5%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11548, "text": "The sizes will increase over time as the Bank\u2019s needs for additional assets grow.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11314, "text": "This largely reflects both strong population growth and a recovery in spending by households.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11255, "text": "Consumers have pulled back their spending in response to higher prices and interest rates, and business investment has contracted.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 4340, "text": "Equity prices for regional banks rose over the intermeeting period but were still well below early March levels.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10732, "text": "The Bank is closely watching inflation expectations and labour costs to ensure that the temporary forces pushing up prices do not become embedded in ongoing inflation.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5247, "text": "Participants observed that, notwithstanding the moderation of inflation so far, inflation remained well above the Committee's 2 percent longer-run objective and that elevated inflation was continuing to harm businesses and households, particularly low-income households.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5076, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11603, "text": "However, tariffs and uncertainty have weakened the outlook.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5332, "text": "Inflation has eased over the past year but remains elevated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10923, "text": "The Governing Council is resolute in its commitment to price stability and will continue to take action as required to achieve the 2% inflation target.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5780, "text": "Participants also noted that the risks to achieving the Committee's employment and inflation goals were moving into better balance and that the Committee remained highly attentive to inflation risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11541, "text": "Director Financial Markets Department Director Financial Markets Department January 29, 2025 Today, the Bank of Canada is announcing its plan to complete its balance sheet normalization, ending quantitative tightening.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10869, "text": "The Bank of Canada today increased its target for the overnight rate to 1\u00bd%, with the Bank Rate at 1\u00be% and the deposit rate at 1\u00bd%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2274, "text": "Participants remarked that developments associated with Russia's invasion of Ukraine, the COVID-related lockdowns in China, and other factors restraining supply conditions would affect the inflation outlook and that it would likely take some time for inflation to move down to the Committee's 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4829, "text": "Tighter credit conditions for households and businesses are likely to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 3716, "text": "Inflation has eased somewhat but remains elevated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11383, "text": "The Bank\u2019s preferred measures of core inflation have been below 3% for several months and the breadth of price increases across components of the CPI is now near its historical norm.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11653, "text": "Government spending also declined.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11210, "text": "The Bank\u2019s preferred measures of core inflation show little downward momentum.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5245, "text": "However, participants also noted that there had been only limited progress in bringing down inflation in core services excluding housing.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 433, "text": "Market-based financing conditions were accommodative, and bank lending standards eased for most loan categories.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 11618, "text": "Starting in April, CPI inflation will be pulled down for one year by the removal of the consumer carbon tax.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 3548, "text": "Over the intermeeting period, investor perceptions of an improved economic outlook in China and Europe contributed to increases in foreign risky asset prices and weighed on the exchange value of the dollar.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 5315, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10716, "text": "Inflation rates have increased in many countries, boosted by these supply bottlenecks and by higher energy prices.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11285, "text": "A strong increase in exports boosted growth.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 983, "text": "The Federal Reserve's ongoing purchases and holdings of securities will continue to foster smooth market functioning and accommodative financial conditions, thereby supporting the flow of credit to households and businesses.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11264, "text": "Shelter costs remain the biggest contributor to above-target inflation.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11333, "text": "The Bank is continuing its policy of balance sheet normalization.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10897, "text": "While global factors such as the war in Ukraine and ongoing supply disruptions have been the biggest drivers, domestic price pressures from excess demand are becoming more prominent.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4767, "text": "They judged that maintaining the current degree of restrictiveness at this time would likely result in further progress toward the Committee's goals while allowing the Committee time to further evaluate this progress.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7878, "text": "The unemployment rate has stabilized at a low level in recent months, and labor market conditions remain solid.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 331, "text": "Supply and demand imbalances related to the pandemic and the reopening of the economy have contributed to sizable price increases in some sectors.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5701, "text": "House prices increased to the upper end of their historical range, relative to rents and Treasury yields, though underwriting standards remained restrictive.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11460, "text": "The Bank of Canada today reduced its target for the overnight rate to 3\u00bc%, with the Bank Rate at 3\u00bd% and the deposit rate at 3\u00bc%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11287, "text": "Overall, the data point to an economy in modest excess supply.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10943, "text": "With higher mortgage rates, the housing market is pulling back as anticipated, following unsustainable growth during the pandemic.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10957, "text": "As economies slow and supply disruptions ease, global inflation is expected to come down.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 5074, "text": "Tighter financial and credit conditions for households and businesses are likely to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11138, "text": "Strong population growth from immigration is adding both demand and supply to the economy: newcomers are helping to ease the shortage of workers while also boosting consumer spending and adding to demand for housing.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11486, "text": "Going forward, we will be evaluating the need for further reductions in the policy rate one decision at a time.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 667, "text": "Respondents to the Open Market Desk's surveys of primary dealers and market participants broadly projected that the Committee would quicken the pace of reduction in the Federal Reserve's net purchases of Treasury securities and agency mortgage-backed securities (MBS), and the median respondent projected net asset purchases to end in March 2022.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8160, "text": "Participants noted, however, that the strategy of flexible average inflation targeting has diminished benefits in an environment with a substantial risk of large inflationary shocks or when ELB risks are less prominent.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11048, "text": "The labour market remains very tight.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 3315, "text": "Broad financial conditions were projected to be somewhat less restrictive than previously assumed, as the effects of a higher path for equity values and a lower path for the dollar more than offset a higher medium-term trajectory for interest rates.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10862, "text": "The Bank will use its monetary policy tools to return inflation to target and keep inflation expectations well-anchored.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10888, "text": "With consumer spending in Canada remaining robust and exports anticipated to strengthen, growth in the second quarter is expected to be solid.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10731, "text": "The Bank now expects CPI inflation to be elevated into next year, and ease back to around the 2 percent target by late 2022.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11386, "text": "The Bank\u2019s preferred measures of core inflation are expected to slow to about 2\u00bd% in the second half of 2024 and ease gradually through 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10733, "text": "The Governing Council judges that in view of ongoing excess capacity, the economy continues to require considerable monetary policy support.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10961, "text": "China\u2019s economy appears to have picked up after the recent round of pandemic lockdowns, although ongoing challenges related to its property market will continue to weigh on growth.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 3183, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7353, "text": "Since earlier in the year, labor market conditions have generally eased, and the unemployment rate has moved up but remains low.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7096, "text": "November 07, 2024 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10693, "text": "Housing market activity pulled back from recent high levels, largely as expected.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11207, "text": "Food inflation is easing from very high rates.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 282, "text": "All members reaffirmed that, in accordance with the Committee's goals to achieve maximum employment and inflation at the rate of 2 percent over the longer run, and with inflation having run persistently below this longer-run goal, they would aim to achieve inflation moderately above 2 percent for some time so that inflation averages 2 percent over time and longer-term inflation expectations remain well anchored at 2 percent.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11309, "text": "In Canada, economic growth stalled in the second half of last year and the economy moved into excess supply.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11170, "text": "The tightness in the labour market has continued to ease gradually.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 8136, "text": "The Committee is attentive to the risks to both sides of its dual mandate and judges that the risks of higher unemployment and higher inflation have risen.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10813, "text": "Both exports and imports have picked up, consistent with solid global demand.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2724, "text": "The dollar's strength largely reflected increasing investor concerns about the global growth outlook as well as widening interest rate differentials between the United States and Japan.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11225, "text": "Financial conditions have also eased, with long-term interest rates unwinding some of the sharp increases seen earlier in the autumn.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 3924, "text": "Participants commented that recent inflation data indicated slower-than-expected progress on disinflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11345, "text": "Labour market data show businesses continue to hire, although employment has been growing at a slower pace than the working-age population.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 6447, "text": "More recent Chinese data, however, especially a steep drop in lending to households and businesses in April, pointed to a considerable slowdown in China's economic activity in this quarter.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 8131, "text": "May 07, 2025 Although swings in net exports have affected the data, recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10794, "text": "The Governing Council therefore decided to end its extraordinary commitment to hold its policy rate at the effective lower bound.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3748, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10788, "text": "CPI inflation remains well above the target range and core measures of inflation have edged up since October.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6863, "text": "Job gains have slowed, and the unemployment rate has moved up but remains low.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 7023, "text": "Almost all participants saw upside risks to the inflation outlook as having diminished, while downside risks to employment were seen as having increased.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 2546, "text": "Several participants observed that recent readings on survey measures of inflation expectations were broadly consistent with the Committee's 2 percent longer-run inflation objective, although a few participants noted that household surveys were indicating increasing divergences in views about the likely longer-run rate of inflation.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6497, "text": "by 2026, total and core PCE price inflation were expected to be close to 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11110, "text": "Overall, excess demand in the economy looks to be more persistent than anticipated.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11401, "text": "Euro-area growth has been boosted by tourism and other services, while manufacturing has been soft.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5716, "text": "Total and core PCE price inflation were both projected to step down in 2024 as demand and supply in product and labor markets moved into better alignment.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 7301, "text": "In discussing the outlook for monetary policy, participants anticipated that if the data came in about as expected, with inflation continuing to move down sustainably to 2 percent and the economy remaining near maximum employment, it would likely be appropriate to move gradually toward a more neutral stance of policy over time.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11390, "text": "Ongoing excess supply is lowering inflationary pressures.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10796, "text": "The Bank will keep its holdings of Government of Canada bonds on its balance sheet roughly constant at least until it begins to raise the policy interest rate.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11077, "text": "Economic growth in the first quarter looks to be stronger than was projected in January, with a bounce in exports and solid consumption growth.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10793, "text": "While COVID-19 continues to affect economic activity unevenly across sectors, the Governing Council judges that overall slack in the economy is absorbed, thus satisfying the condition outlined in the Bank\u2019s forward guidance on its policy interest rate.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2880, "text": "The Board of Governors of the Federal Reserve System voted unanimously to approve a 3/4 percentage point increase in the primary credit rate to 3.25 percent, effective September 22, 2022.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 339, "text": "The Committee decided to keep the target range for the federal funds rate at 0 to 1/4 percent and expects it will be appropriate to maintain this target range until labor market conditions have reached levels consistent with the Committee's assessments of maximum employment and inflation has risen to 2 percent and is on track to moderately exceed 2 percent for some time.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 8554, "text": "Participants judged that there were downside risks to employment and economic activity and upside risks to inflation, but that these risks had decreased as expectations about effective tariff rates and their effects had declined from levels in April.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11387, "text": "The Bank expects CPI inflation to come down below core inflation in the second half of this year, largely because of base year effects on gasoline prices.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 3187, "text": "In determining the pace of future increases in the target range, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10695, "text": "Employment rebounded through June and July, with hard-to-distance sectors hiring as public health restrictions eased.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10969, "text": "Economic growth is expected to stall through the end of this year and the first half of next year as the effects of higher interest rates spread through the economy.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11497, "text": "Growth in the United States has been revised up, mainly due to stronger consumption.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5819, "text": "Inflation has eased over the past year but remains elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3624, "text": "Some participants judged that recent economic data signaled a somewhat higher chance of continued subdued economic growth, with inflation falling over time to the Committee's longer-run goal of 2 percent, al\u00adthough some participants noted that the probability of the economy entering a recession in 2023 remained elevated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 1580, "text": "Foreign asset prices were highly volatile over the intermeeting period in response to geopolitical developments, central bank communications, and rising inflation concerns.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10818, "text": "CPI inflation is currently at 5.1%, as expected in January, and remains well above the Bank\u2019s target range.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5579, "text": "The economic outlook is uncertain, and the Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11620, "text": "However, we expect tariffs and supply chain disruptions to push up some prices.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5139, "text": "Meanwhile, equity prices decreased, and spreads on investment- and speculative-grade corporate bonds widened.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 5340, "text": "In determining the extent of any additional policy firming that may be appropriate to return inflation to 2 percent over time, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 4643, "text": "Beyond this year, the policy rate path implied by overnight index swap (OIS) quotes ended the period modestly higher.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 711, "text": "However, several participants raised concerns about vulnerabilities in the Treasury market and how those vulnerabilities could affect the appropriate pace of balance sheet normalization.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7682, "text": "After a period of considerable rebalancing, labor market conditions had stabilized, and the unemployment rate remained low.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 5660, "text": "Staff Review of the Financial Situation Over the intermeeting period, nominal Treasury yields declined, and the expected market-implied path for the federal funds rate through 2024 shifted downward, as market participants viewed monetary policy communications, on balance, as pointing to notably less restrictive policy than expected.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6886, "text": "These sharp moves appeared to be the result of a rapid unwinding of some speculative trading positions induced by unrelated events\u00e2\u0080\u0094such as the unexpectedly inflation-focused communications from the Bank of Japan (BOJ) in late July and the weaker-than-expected U.S. employment report in early August\u00e2\u0080\u0094and amplified by technical and liquidity factors.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11347, "text": "Overall, recent data suggest the economy is still operating in excess supply.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10804, "text": "This will add to inflation around the world, and negative impacts on confidence and new supply disruptions could weigh on global growth.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10971, "text": "In the last three months, CPI inflation has declined from 8.1% to 6.9%, primarily due to a fall in gasoline prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11688, "text": "Growth in business and household spending is being restrained by uncertainty.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10820, "text": "Poor harvests and higher transportation costs have pushed up food prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 7771, "text": "A number of participants remarked that current readings of 12-month inflation were boosted by relatively high inflation readings in the first quarter of last year, and several participants noted that cumulative inflation over the past 3, 6, or 9 months showed greater progress than 12\u00e2\u0080\u0091month measures.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11445, "text": "Inflation in shelter costs remains elevated but has begun to ease.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11175, "text": "Year-over-year and three-month measures of core inflation are now both running at about 3.5%, indicating there has been little recent downward momentum in underlying inflation.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11394, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6900, "text": "In secured funding markets, rates on overnight repurchase agreements (repo) were higher than a few months earlier amid large issuance of Treasury securities and elevated demand for securities financing but were little changed, on net, over the period.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10707, "text": "We will continue to provide the appropriate degree of monetary policy stimulus to support the recovery and achieve the inflation objective.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 2835, "text": "Several participants noted that, particularly in the current highly uncertain global economic and financial environment, it would be important to calibrate the pace of further policy tightening with the aim of mitigating the risk of significant adverse effects on the economic outlook.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11099, "text": "Globally, consumer price inflation is coming down, largely reflecting lower energy prices compared to a year ago, but underlying inflation remains stubbornly high.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10874, "text": "Almost 70% of CPI categories now show inflation above 3%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3451, "text": "Inflation has eased somewhat but remains elevated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11373, "text": "The unemployment rate has risen to 6.4%, with employment continuing to grow more slowly than the labour force and job seekers taking longer to find work.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 10756, "text": "Housing activity had been moderating, but appears to be regaining strength, notably in resales.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 6455, "text": "Consistent with the slight downward shift in the implied policy path, nominal Treasury yields at all maturities also moved down moderately, driven primarily by declines in real Treasury yields.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10986, "text": "Global economic growth is slowing, although it is proving more resilient than was expected at the time of the October Monetary Policy Report (MPR).", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11020, "text": "This overall slowdown in activity will allow supply to catch up with demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 341, "text": "Beginning later this month, the Committee will increase its holdings of Treasury securities by at least $70 billion per month and of agency mortgage\u00e2\u0080\u0091backed securities by at least $35 billion per month.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7295, "text": "In their consideration of monetary policy at this meeting, participants noted that inflation had made progress toward the Committee's objective but remained somewhat elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 790, "text": "Renewed concerns about the course of the pandemic also contributed to a decline in the 10-year Treasury yield, on net, over the intermeeting period despite stronger-than-anticipated data on economic activity and surprisingly high inflation.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10987, "text": "In the United States, the economy is weakening but consumption continues to be solid and the labour market remains overheated.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 332, "text": "Overall financial conditions remain accommodative, in part reflecting policy measures to support the economy and the flow of credit to U.S. households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10719, "text": "In Canada, robust economic growth has resumed, following a pause in the second quarter.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 1744, "text": "Job gains have been robust in recent months, and the unemployment rate has declined substantially.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11051, "text": "Inflation eased to 5.9% in January, reflecting lower price increases for energy, durable goods and some services.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10873, "text": "As pervasive input price pressures feed through into consumer prices, inflation continues to broaden, with core measures of inflation ranging between 3.2% and 5.1%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6485, "text": "While delinquency rates on residential mortgages remained near pre-pandemic lows, credit card and auto loan delinquency rates continued to rise in the first quarter, signaling a further deterioration of balance sheets of some households.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 3182, "text": "The war and related events are contributing to upward pressure on inflation and are weighing on global economic activity.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10736, "text": "In light of the progress made in the economic recovery, the Governing Council has decided to end quantitative easing and keep its overall holdings of Government of Canada bonds roughly constant.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10968, "text": "Also, the slowdown in international demand is beginning to weigh on exports.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 2040, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2044, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11692, "text": "In the current tariff scenario , after contracting in the second quarter, GDP growth picks up to about 1% in the second half of this year as exports stabilize and household spending increases gradually.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 132, "text": "After accounting for the seasonal summer lull in activity, gross corporate bond issuance remained solid in July and August.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11047, "text": "Restrictive monetary policy continues to weigh on household spending, and business investment has weakened alongside slowing domestic and foreign demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 3942, "text": "Participants also noted that recent developments in the banking sector would likely result in tighter credit conditions for households and businesses and weigh on economic activity, hiring, and inflation, though the extent of these effects was highly uncertain.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5781, "text": "Participants continued to be resolute in their commitment to bring inflation down to the Committee's 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5584, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11043, "text": "Commodity prices have evolved roughly in line with the Bank\u2019s expectations, but the strength of China\u2019s recovery and the impact of Russia\u2019s war in Ukraine remain key sources of upside risk.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5852, "text": "The Committee does not expect it will be appropriate to reduce the target range until it has gained greater confidence that inflation is moving sustainably toward 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11282, "text": "In Canada, the economy grew in the fourth quarter by more than expected, although the pace remained weak and below potential.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10912, "text": "Business investment is solid and exports are being boosted by elevated commodity prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11164, "text": "Global bond yields have risen, reflecting higher real interest rates, and international oil prices are higher than was assumed in the July Monetary Policy Report (MPR).", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5342, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11235, "text": "Combined with the drop in gasoline prices, this contributed to the easing of CPI inflation to 3.1% in October.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11206, "text": "Higher interest rates are moderating inflation in many goods that people buy on credit, and this is spreading to services.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6112, "text": "In recent months, there has been a lack of further progress toward the Committee's 2 percent inflation objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5118, "text": "Al\u00adthough total nonfarm payroll employment rose at a faster pace in September than in previous months, the unemployment rate was unchanged at 3.8 percent", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11241, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5895, "text": "Considerations for Slowing the Pace of Balance Sheet Reduction Participants began a discussion related to slowing the pace of balance sheet runoff consistent with the Committee's Plans for Reducing the Size of the Federal Reserve's Balance Sheet announced in May 2022.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 5227, "text": "Some participants noted that businesses were benefiting from an increased ability to hire and retain workers, better-functioning supply chains, or reduced input cost pressures.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 2633, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2, "text": "With progress on vaccinations and strong policy support, indicators of economic activity and employment have continued to strengthen.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10723, "text": "This is contributing to labour shortages in certain sectors, even as slack remains in the overall labour market.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7097, "text": "Since earlier in the year, labor market conditions have generally eased, and the unemployment rate has moved up but remains low.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 344, "text": "The Federal Reserve's ongoing purchases and holdings of securities will continue to foster smooth market functioning and accommodative financial conditions, thereby supporting the flow of credit to households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 1743, "text": "May 04, 2022 Although overall economic activity edged down in the first quarter, household spending and business fixed investment remained strong.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8445, "text": "Market-implied inflation compensation for the year ahead fell about 20 basis points over the intermeeting period, while longer-term inflation compensation measures were little changed.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10975, "text": "The Bank expects CPI inflation to ease as higher interest rates help rebalance demand and supply, price pressures from global supply disruptions fade, and the past effects of higher commodity prices dissipate.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11630, "text": "how much and how quickly cost increases are passed on to consumer prices; and how inflation expectations evolve.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11250, "text": "Meanwhile, oil prices are about $10 per barrel lower than was assumed in the October Monetary Policy Report (MPR).", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 4227, "text": "Some participants also noted concerns that the statutory limit on federal debt might not be raised in a timely manner, threatening significant disruptions to the financial system and tighter financial conditions that weaken the economy.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10701, "text": "Core measures of inflation have risen, but by less than the CPI.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 569, "text": "Committee Policy Action In their discussion of monetary policy for this meeting, members agreed that with progress on vaccinations and strong policy support, indicators of economic activity and employment had continued to strengthen.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 2757, "text": "moreover, this lower trajectory for potential output was expected to persist throughout the forecast period.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2327, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2732, "text": "Borrowing costs for residential mortgage loans increased and reached their highest levels since 2008.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11613, "text": "Trade tensions are also disrupting recovery in the labour market.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 3823, "text": "In contrast, core inflation has shown little sign of easing in most foreign economies amid tight labor markets.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11275, "text": "Global economic growth slowed in the fourth quarter.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11356, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1395, "text": "Members agreed to remove the opening sentence from previous postmeeting statements regarding using the Federal Reserve's full range of tools to support the U.S. economy.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11602, "text": "Global economic growth was solid in late 2024 and inflation has been easing towards central bank targets.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11376, "text": "This reflects stronger exports and a recovery in household spending and business investment as borrowing costs ease.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11363, "text": "In the United States, the anticipated economic slowdown is materializing, with consumption growth moderating.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4986, "text": "However, participants also noted that significant progress in reducing inflation had yet to become apparent in the prices of core services excluding housing.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 791, "text": "Broad equity indexes were little changed, on net, since the previous FOMC meeting, as strong economic data appeared to offset concerns regarding monetary policy, inflation, and the pandemic.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 5792, "text": "In discussing risk-management considerations that could bear on the policy outlook, participants remarked that while the risks to achieving the Committee's employment and inflation goals were moving into better balance, they remained highly attentive to inflation risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11504, "text": "Oil prices have been volatile and in recent weeks have been about $5 higher than was assumed in the October MPR.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 2069, "text": "Across the yield curve, rates on nominal Treasury securities ended the period significantly higher, primarily reflecting the revision in the outlook for monetary policy and the associated rise in real yields.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11268, "text": "The Council is still concerned about risks to the outlook for inflation, particularly the persistence in underlying inflation.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11585, "text": "Against this background, and with inflation close to the 2% target, Governing Council decided to reduce the policy rate by a further 25 basis points.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 638, "text": "Beginning in January, the Committee will increase its holdings of Treasury securities by at least $40 billion per month and of agency mortgage\u00e2\u0080\u0091backed securities by at least $20 billion per month.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 337, "text": "With inflation having run persistently below this longer-run goal, the Committee will aim to achieve inflation moderately above 2 percent for some time so that inflation averages 2 percent over time and longer\u00e2\u0080\u0091term inflation expectations remain well anchored at 2 percent.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11247, "text": "While growth in the United States has been stronger than expected, it is anticipated to slow in 2024, with weakening consumer spending and business investment.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11642, "text": "US inflation has ticked down but remains above 2%, with the price effects of tariffs still to come.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11453, "text": "With inflation now back around the 2% target, Governing Council decided to reduce the policy rate by 50 basis points to support economic growth and keep inflation close to the middle of the 1% to 3% range.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 5218, "text": "Participants continued to view a period of below-potential growth in real GDP and some further softening in labor market conditions as likely to be needed to reduce inflation pressures sufficiently to return inflation to 2 percent over time.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10991, "text": "While commodity exports have been strong, there is growing evidence that tighter monetary policy is restraining domestic demand: consumption moderated in the third quarter, and housing market activity continues to decline.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 6118, "text": "The Committee does not expect it will be appropriate to reduce the target range until it has gained greater confidence that inflation is moving sustainably toward 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6613, "text": "July 31, 2024 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4098, "text": "The market-implied path for the federal funds rate in 2023 increased modestly over the period.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2171, "text": "In addition, market indicators of future default expectations of businesses deteriorated to some extent, as investors appeared to mark down their assessment of the macroeconomic outlook.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10757, "text": "The devastating floods in British Columbia and uncertainties arising from the Omicron variant could weigh on growth by compounding supply chain disruptions and reducing demand for some services.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11191, "text": "However, with underlying inflation persisting, central banks continue to be vigilant.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1905, "text": "The staff noted that the first-quarter decline in real GDP was driven by categories of spending that had often been volatile in the past, and they viewed the continued strength in private domestic final demand, the labor market, and industrial production as providing a more accurate picture of the economy's direction in the first quarter.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10948, "text": "The Governing Council remains resolute in its commitment to price stability and will continue to take action as required to achieve the 2% inflation target.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5082, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11570, "text": "This growth path is stronger than was expected at the time of the January MPR.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11558, "text": "The Bank of Canada today reduced its target for the overnight rate to 2.75%, with the Bank Rate at 3% and the deposit rate at 2.70%.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 1175, "text": "Regarding the potential for the Committee to reduce System Open Market Account (SOMA) holdings in the future, market participants generally anticipated that SOMA redemptions could proceed smoothly at a somewhat faster pace than during the previous period of balance sheet reduction from 2017 to 2019.", "bank": "F
