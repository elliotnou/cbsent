Desk will begin adding regular morning standing repo facility (SRF) operations to the existing afternoon operations.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10767, "text": "We will provide the appropriate degree of monetary policy stimulus to support the recovery and achieve the inflation target.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11650, "text": "Strong spending on machinery and equipment held up growth in business investment by more than expected.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7843, "text": "Members agreed to continue to reduce the Federal Reserve's holdings of Treasury securities and agency debt and agency MBS.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11201, "text": "The near-term weakness in growth reflects both the broadening impact of past increases in interest rates and slower foreign demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 2902, "text": "In determining the pace of future increases in the target range, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11533, "text": "The intent of this change is to improve the circulation of settlement balances as they decline towards steady state levels over the coming months and support the functioning of short-term funding markets.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11028, "text": "Inflation is projected to come down significantly this year.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11233, "text": "Overall, these data and indicators for the fourth quarter suggest the economy is no longer in excess demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 7923, "text": "Asset price dynamics abroad were opposite to those in the U.S. Major foreign equity indexes, including those of the euro area and China, appreciated notably over the intermeeting period, while sovereign yields increased in many jurisdictions.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11293, "text": "The Council is still concerned about risks to the outlook for inflation, particularly the persistence in underlying inflation.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6615, "text": "Inflation has eased over the past year but remains somewhat elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8030, "text": "Information from participants' business contacts and from many surveys indicated some deterioration in household and business sentiment amid heightened uncertainty about government policies.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11313, "text": "Economic growth is forecast to pick up in 2024.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6784, "text": "A few participants noted that the agricultural sector continued to face strains stemming from low food commodity prices and high input costs.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11628, "text": "These include: the extent to which higher tariffs reduce demand for Canadian exports", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10935, "text": "In Canada, CPI inflation eased in July to 7.6% from 8.1% because of a drop in gasoline prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11213, "text": "With clearer signs that monetary policy is moderating spending and relieving price pressures, Governing Council decided to hold the policy rate at 5% and to continue to normalize the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2959, "text": "Residential investment dropped further, however, and business fixed investment growth was held back by a decline in nonresidential structures investment.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7893, "text": "Voting against this action was Christopher J. Waller, who supported no change for the federal funds target range but preferred to continue the current pace of decline in securities holdings.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10959, "text": "The Bank projects no growth in the US economy through most of next year.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11406, "text": "Oil prices are lower than assumed in the July MPR.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11266, "text": "While the slowdown in demand is reducing price pressures in a broader number of CPI components and corporate pricing behaviour continues to normalize, core measures of inflation are not showing sustained declines.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10857, "text": "Inflation is being driven by rising energy and food prices and supply disruptions, in combination with strong global and domestic demand.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11108, "text": "In addition, spending on interest-sensitive goods increased and, more recently, housing market activity has picked up.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11029, "text": "Lower energy prices, improvements in global supply conditions, and the effects of higher interest rates on demand are expected to bring CPI inflation down to around 3% in the middle of this year and back to the 2% target in 2024.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4572, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11705, "text": "With still high uncertainty, the Canadian economy showing some resilience, and ongoing pressures on underlying inflation, Governing Council decided to hold the policy interest rate unchanged.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 6744, "text": "Core goods prices were about flat from March through June after having risen during the first three months of the year.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5167, "text": "In the October Senior Loan Officer Opinion Survey on Bank Lending Practices (SLOOS), banks reported tightening standards and terms on C&I loans to firms of all sizes in the third quarter.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 3709, "text": "In addition, members agreed that they would continue reducing the Federal Reserve's holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10933, "text": "China is facing ongoing challenges from COVID shutdowns.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11505, "text": "In Canada, past cuts to interest rates have started to boost the economy.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11258, "text": "However, wages are still rising around 4% to 5%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11422, "text": "The Bank of Canada today reduced its target for the overnight rate to 3\u00be%, with the Bank Rate at 4% and the deposit rate at 3\u00be%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11437, "text": "Overall, the economy continues to be in excess supply.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10720, "text": "Strong employment gains in recent months were concentrated in hard-to-distance sectors and among workers most affected by lockdowns.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11260, "text": "In the second half of 2024, household spending will likely pick up and exports and business investment should get a boost from recovering foreign demand.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6321, "text": "Participants remained highly attentive to inflation risks and noted the uncertainty associated with the economic outlook.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4082, "text": "Real GDP growth was modest in the first quarter, led by an increase in PCE.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11084, "text": "This implies the economy will move into excess supply in the second half of this year.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 1691, "text": "They also noted that, depending on economic and financial developments, a move to a tighter policy stance could be warranted.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3459, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7082, "text": "She also expressed her concern that the Committee's larger policy action could be seen as a premature declaration of victory on the price-stability part of the dual mandate.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6586, "text": "At the conclusion of the discussion, the Committee voted to direct the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the SOMA in accordance with the following domestic policy directive, for release at 2:00 p.m.: \"Effective June 13, 2024, the Federal Open Market Committee directs the Desk to: The vote also encompassed approval of the statement below for release at 2:00 p.m.: \"Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11196, "text": "The surge in Canada\u2019s population is easing labour market pressures in some sectors while adding to housing demand and consumption.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7192, "text": "In the U.K., yields increased following the release of the new government's budget as market participants processed the budget's impact on projected inflation and gilt issuance.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6808, "text": "The vast majority observed that, if the data continued to come in about as expected, it would likely be appropriate to ease policy at the next meeting.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10827, "text": "The Governing Council will also be considering when to end the reinvestment phase and allow its holdings of Government of Canada bonds to begin to shrink.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10983, "text": "The Bank of Canada today increased its target for the overnight rate to 4\u00bc%, with the Bank Rate at 4\u00bd% and the deposit rate at 4\u00bc%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11267, "text": "Given the outlook, Governing Council decided to hold the policy rate at 5% and to continue to normalize the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11343, "text": "Weaker inventory investment dampened activity.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10908, "text": "Further excess demand has built up in the Canadian economy.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11578, "text": "Meanwhile, wage growth has shown signs of moderation.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11197, "text": "In the labour market, recent job gains have been below labour force growth and job vacancies have continued to ease.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11576, "text": "In February, job growth stalled.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 10832, "text": "The Bank of Canada today increased its target for the overnight rate to 1%, with the Bank Rate at 1\u00bc% and the deposit rate at 1%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 5334, "text": "Tighter financial and credit conditions for households and businesses are likely to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4443, "text": "The staff's inflation forecast was little revised relative to the previous projection, and supply\u00e2\u0080\u0093demand imbalances in both goods markets and labor markets were still judged to be easing only slowly.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11403, "text": "In China, weak domestic demand weighed on economic growth.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 6523, "text": "Participants remarked that demand and supply in the labor market had continued to come into better balance.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 6173, "text": "Regarding consumer price inflation, total PCE prices increased 2.7 percent over the 12 months ending in March, while core PCE price inflation\u00e2\u0080\u0094which excludes changes in energy prices and many consumer food prices\u00e2\u0080\u0094was 2.8 percent over the same period.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11664, "text": "These include: the extent to which higher US tariffs reduce demand for Canadian exports", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11397, "text": "The Bank of Canada today reduced its target for the overnight rate to 4\u00bc%, with the Bank Rate at 4\u00bd% and the deposit rate at 4\u00bc%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 4229, "text": "However, a few participants cited the possibility that further tightening of credit conditions could slow household spending and reduce business investment and hiring, all of which would support the ongoing rebalancing of supply and demand in product and labor markets and reduce inflation pressures.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 6330, "text": "Members also concurred that, in recent months, there was a lack of further progress toward the Committee's 2 percent inflation objective and agreed to acknowledge this development in the postmeeting statement.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4575, "text": "Tighter credit conditions for households and businesses are likely to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4901, "text": "Real yields increased almost as much as or a little more than nominal yields, leaving implied measures of inflation compensation modestly changed.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11375, "text": "GDP growth is forecast to increase in the second half of 2024 and through 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11305, "text": "Since January, bond yields have increased but, with narrower corporate credit spreads and sharply higher equity markets, overall financial conditions have eased.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 11684, "text": "The current tariff scenario has global growth slowing modestly to around 2\u00bd% by the end of 2025 before returning to around 3% over 2026 and 2027.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11315, "text": "Residential investment is strengthening, responding to continued robust demand for housing.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10859, "text": "CPI inflation is now expected to average almost 6% in the first half of 2022 and remain well above the control range throughout this year.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10780, "text": "The economy entered 2022 with considerable momentum, and a broad set of measures are now indicating that economic slack is absorbed.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 629, "text": "Supply and demand imbalances related to the pandemic and the reopening of the economy have continued to contribute to elevated levels of inflation.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11027, "text": "Year-over-year measures of core inflation are still around 5%, but 3-month measures of core inflation have come down, suggesting that core inflation has peaked.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10963, "text": "This is a slower pace of growth than was projected in the Bank\u2019s July Monetary Policy Report (MPR).", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11057, "text": "Both will need to come down further, as will short-term inflation expectations, to return inflation to the 2% target.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11485, "text": "Governing Council has reduced the policy rate substantially since June.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 5882, "text": "At the end of the intermeeting period, the Bank of Japan (BOJ) announced that it would discontinue its policies of a negative short-term interest rate and yield curve control", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10843, "text": "As policy stimulus is withdrawn, US growth is expected to moderate to a pace more in line with potential growth.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11291, "text": "The Bank continues to expect inflation to remain close to 3% during the first half of this year before gradually easing.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11335, "text": "In the United States, the economy expanded more slowly than was expected, as weakness in exports and inventories weighed on activity.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 7182, "text": "These measures continued to suggest an expectation that inflation would return over time to the Committee's 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11193, "text": "In Canada, there is growing evidence that past interest rate increases are dampening economic activity and relieving price pressures.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 8164, "text": "Participants also noted that the Committee's strategy should reflect its willingness to make forceful use of all available tools as appropriate should the risks of hitting the ELB again materialize.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11461, "text": "The Bank is continuing its policy of balance sheet normalization.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7877, "text": "March 19, 2025 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 3718, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11693, "text": "In this scenario, economic slack persists in 2026 and diminishes as growth picks up to close to 2% in 2027.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2232, "text": "With the tightness in labor markets anticipated to diminish over time, participants generally expected the unemployment rate to increase, as the median projection of the unemployment rate in the June SEP showed a gradual rise over the next few years, reaching 4.1 percent in 2024.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 5916, "text": "In their discussions regarding how to adjust the pace of runoff, participants generally favored reducing the monthly pace of runoff by roughly half from the recent overall pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11288, "text": "CPI inflation eased to 2.9% in January, as goods price inflation moderated further.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 1799, "text": "The effective federal funds rate rose 25 basis points following the increase in the target range at the March FOMC meeting and remained stable throughout the period.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11324, "text": "The Bank expects CPI inflation to be close to 3% during the first half of this year, move below 2\u00bd% in the second half, and reach the 2% inflation target in 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4873, "text": "Total nonfarm payroll employment increased at a slower pace over July and August than in the second quarter.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 3258, "text": "Staff Review of the Financial Situation Over the intermeeting period, Treasury yields and measures of inflation compensation declined, on net, and the implied path of the federal funds rate in 2023 ended modestly lower.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 7700, "text": "Inflation abroad continued to ease.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11172, "text": "Recent CPI data indicate that inflationary pressures remain broad-based.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11413, "text": "High shelter price inflation is still the biggest contributor to total inflation but is starting to slow.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10696, "text": "This is reducing unevenness in the labour market, although considerable slack remains and some groups \u2013 particularly low-wage workers \u2013 are still disproportionately affected.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11104, "text": "Financial conditions have tightened back to those seen before the bank failures in the United States and Switzerland.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 10973, "text": "The Bank\u2019s preferred measures of core inflation are not yet showing meaningful evidence that underlying price pressures are easing.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 636, "text": "With inflation having exceeded 2 percent for some time, the Committee expects it will be appropriate to maintain this target range until labor market conditions have reached levels consistent with the Committee's assessments of maximum employment.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 1171, "text": "Several central banks concluded their net asset purchases late last year, and more were expected to do so this year.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11367, "text": "Global financial conditions have eased, with lower bond yields, buoyant equity prices, and robust corporate debt issuance.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 2432, "text": "In domestic credit markets, longer-term borrowing costs for households and businesses with higher credit ratings declined over the intermeeting period but borrowing costs for lower rated firms were higher, on net.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 6700, "text": "For smaller firms, however, credit availability remained moderately tight.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 10856, "text": "CPI inflation in Canada is 5.7%, above the Bank\u2019s forecast in its January Monetary Policy Report (MPR) .", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6122, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6548, "text": "Some participants highlighted reasons why inflation could remain above 2 percent for longer than expected.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8318, "text": "Several participants commented that labor market conditions were unlikely to be a source of inflationary pressure.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 5336, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 105, "text": "Inflation abroad was elevated, reflecting reversals of price declines early in the pandemic, past increases in energy and commodity prices, upward pressures from supply bottlenecks, and past exchange rate depreciations in some EMEs.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 521, "text": "With COVID-19 cases expected to remain below the summer's levels, participants anticipated better payroll numbers in the months ahead.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 4017, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11253, "text": "With softer growth this year, inflation rates in most advanced economies are expected to come down slowly, reaching central bank targets in 2025.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4694, "text": "House prices, while having cooled earlier this year, started to rise again, and price-to-rent ratios remained at elevated levels and near those seen in the mid-2000s.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10937, "text": "The Bank\u2019s core measures of inflation continued to move up, ranging from 5% to 5.5% in July.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10745, "text": "Economic growth in the United States has accelerated, led by consumption, while growth in some other regions is moderating after a strong third quarter.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7526, "text": "Most participants noted that risks to the achievement of the Committee's maximum-employment goal appeared to be roughly balanced, though some saw risks to the labor market as tilted to the downside.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11103, "text": "Growth in China is expected to slow after surging in the first quarter.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6802, "text": "While inflation remained somewhat above the Committee's longer-run goal of 2 percent, participants noted that inflation had eased over the past year and that recent incoming data indicated some further progress toward the Committee's objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11709, "text": "These include: the extent to which higher US tariffs reduce demand for Canadian exports", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2194, "text": "In their discussion of current economic conditions, participants noted that overall economic activity appeared to have picked up after edging down in the first quarter.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11215, "text": "Governing Council wants to see downward momentum in core inflation, and continues to be focused on the balance between demand and supply in the economy, inflation expectations, wage growth and corporate pricing behaviour.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10702, "text": "The Governing Council judges that the Canadian economy still has considerable excess capacity, and that the recovery continues to require extraordinary monetary policy support.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 2589, "text": "Members agreed that inflation remained elevated, reflecting supply and demand imbalances related to the pandemic, higher food and energy prices, and broader price pressures.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10980, "text": "We are resolute in our commitment to restore price stability for Canadians and will continue to take action as required to achieve the 2% inflation target.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11658, "text": "The Bank\u2019s preferred measures of core inflation, as well as other measures of underlying inflation, moved up.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6115, "text": "The economic outlook is uncertain, and the Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10942, "text": "While this was somewhat weaker than the Bank had projected, indicators of domestic demand were very strong \u2013 consumption grew by about 9\u00bd% and business investment was up by close to 12%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 10951, "text": "The Bank of Canada today increased its target for the overnight rate to 3\u00be%, with the Bank Rate at 4% and the deposit rate at 3\u00be%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7593, "text": "January 29, 2025 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 973, "text": "Supply and demand imbalances related to the pandemic and the reopening of the economy have continued to contribute to elevated levels of inflation.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11307, "text": "Inflation continues to slow across most advanced economies, although progress will likely be bumpy.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10717, "text": "While bond yields have risen in recent weeks, financial conditions remain accommodative and continue to support economic activity.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 11554, "text": "Purchases of GoC bonds will likely not need to start until towards the end of 2026 at the earliest based on current projections for the Bank\u2019s future asset needs.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10690, "text": "Financial conditions remain highly accommodative.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 4336, "text": "The increase in nominal yields primarily reflected higher real rates rather than inflation compensation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10907, "text": "The Bank now expects global economic growth to slow to about 3\u00bd% this year and 2% in 2023 before strengthening to 3% in 2024.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11711, "text": "how much and how quickly cost increases from tariffs and trade disruptions are passed on to consumer prices; and how inflation expectations evolve.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11482, "text": "Looking ahead, the GST holiday will temporarily lower inflation but that will be unwound once the GST break ends.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11248, "text": "In the euro area, the economy looks to be in a mild contraction.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11259, "text": "Economic growth is expected to strengthen gradually around the middle of 2024.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 5574, "text": "January 31, 2024 Recent indicators suggest that economic activity has been expanding at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11342, "text": "At 1.7%, first-quarter GDP growth was slower than forecast in the MPR.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11071, "text": "In the United States, recent stress in the banking sector has tightened credit conditions further.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 2225, "text": "Additionally, most business contacts had continued to report persistent wage pressures as well as difficulties in hiring and retaining workers.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2688, "text": "Survey-based measures of short-run inflation expectations declined in recent weeks, while measures of longer-term inflation expectations remained roughly stable or moved lower.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 4435, "text": "In consumer credit markets, conditions stayed generally accommodative, with credit available for most borrowers.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10877, "text": "The increase in global inflation is occurring as the global economy slows.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10954, "text": "This reflects the strength of the global recovery from the pandemic, a series of global supply disruptions, and elevated commodity prices, particularly for energy, which have been pushed up by Russia\u2019s attack on Ukraine.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 2758, "text": "As a result, the staff's estimate of the output gap was revised up considerably this year, and while the staff projection still had the output gap closing in coming years, the level of output was expected to be slightly above potential at the end of 2025.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11332, "text": "The Bank of Canada today reduced its target for the overnight rate to 4\u00be%, with the Bank Rate at 5% and the deposit rate at 4\u00be%.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 139, "text": "Trailing default rates on corporate bonds and leveraged loans remained low, as did market indicators of future default expectations.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11450, "text": "With inflationary pressures no longer broad-based, business and consumer inflation expectations have largely normalized.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4315, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10812, "text": "This is stronger than the Bank\u2019s projection and confirms its view that economic slack has been absorbed.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 6209, "text": "Banks reported tightening standards further in the April SLOOS for all loan categories of commercial real estate (CRE) loans.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 1, "text": "September 22, 2021 The Federal Reserve is committed to using its full range of tools to support the U.S. economy in this challenging time, thereby promoting its maximum employment and price stability goals.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 2864, "text": "Members affirmed that the Committee was strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4392, "text": "As a result, Treasury yields and the expected future path for the federal funds rate shifted upward significantly.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10837, "text": "Supply disruptions resulting from the war are also exacerbating ongoing supply constraints and weighing on activity.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11039, "text": "Global growth continues to slow, and inflation, while still too high, is coming down due primarily to lower energy prices.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10815, "text": "However, the rebound from Omicron now appears to be well in train: household spending is proving resilient and should strengthen further with the lifting of public health restrictions.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 5794, "text": "Some participants noted the risk that progress toward price stability could stall, particularly if aggregate demand strengthened or supply-side healing slowed more than expected.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9, "text": "With inflation having run persistently below this longer-run goal, the Committee will aim to achieve inflation moderately above 2 percent for some time so that inflation averages 2 percent over time and longer\u00e2\u0080\u0091term inflation expectations remain well anchored at 2 percent.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 5236, "text": "Nevertheless, participants assessed that labor supply and labor demand were continuing to come into better balance.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11123, "text": "The Bank of Canada today increased its target for the overnight rate to 5%, with the Bank Rate at 5\u00bc% and the deposit rate at 5%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6565, "text": "Some remarked that the continued strength of the economy, as well as other factors, could mean that the longer-run equilibrium interest rate was higher than previously assessed, in which case both the stance of monetary policy and overall financial conditions may be less restrictive than they might appear.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11139, "text": "As higher interest rates continue to work their way through the economy, the Bank expects economic growth to slow, averaging around 1% through the second half of this year and the first half of next year.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11254, "text": "In Canada, the economy has stalled since the middle of 2023 and growth will likely remain close to zero through the first quarter of 2024.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11149, "text": "Governing Council remains concerned that progress towards the 2% target could stall, jeopardizing the return to price stability.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6382, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 476, "text": "In particular, bond and leveraged loan spreads remained narrow, while equity prices continued to increase, supported by strong earnings expectations, still-low Treasury yields, and high risk appetite.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11584, "text": "While economic growth has come in stronger than expected, the pervasive uncertainty created by continuously changing US tariff threats is restraining consumers\u2019 spending intentions and businesses\u2019 plans to hire and invest.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 4601, "text": "Most survey respondents had a modal expectation that a July rate hike would be the last of this tightening cycle, although most respondents also perceived that additional monetary policy tightening after the July FOMC meeting was possible.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11192, "text": "Oil prices are higher than was assumed in July, and the war in Israel and Gaza is a new source of geopolitical uncertainty.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 2283, "text": "Members also agreed that COVID-related lockdowns in China were likely to exacerbate supply chain disruptions.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2323, "text": "Nonetheless, job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 4, "text": "Inflation is elevated, largely reflecting transitory factors.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 1760, "text": "Implementation Note issued May 4, 2022 Plans for Reducing the Size of the Federal Reserve's Balance Sheet", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11574, "text": "The negative impact of slowing domestic demand has been partially offset by a surge in exports in advance of tariffs being imposed.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7920, "text": "U.S. equity prices decreased notably, on net, over the intermeeting period, with particularly pronounced declines in the technology and cyclical sectors.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 3870, "text": "Given their assessment of the potential economic effects of the recent banking-sector developments, the staff's projection at the time of the March meeting included a mild recession starting later this year, with a recovery over the subsequent two years.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10829, "text": "The timing and pace of further increases in the policy rate, and the start of QT, will be guided by the Bank\u2019s ongoing assessment of the economy and its commitment to achieving the 2% inflation target.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11471, "text": "Historical revisions to the National Accounts have increased the level of GDP over the past three years, largely reflecting higher investment and consumption.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4281, "text": "All members affirmed that they are strongly committed to returning inflation to their 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11325, "text": "Based on the outlook, Governing Council decided to hold the policy rate at 5% and to continue to normalize the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7659, "text": "The manager noted that measures of inflation compensation had generally risen slightly.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 2035, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 10764, "text": "The Governing Council judges that in view of ongoing excess capacity, the economy continues to require considerable monetary policy support.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 2034, "text": "June 15, 2022 Overall economic activity appears to have picked up after edging down in the first quarter.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10800, "text": "The Bank of Canada today increased its target for the overnight rate to \u00bd %, with the Bank Rate at \u00be % and the deposit rate at \u00bd %.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 1775, "text": "For the current meeting, federal funds futures implied around 50 basis points of policy rate tightening, and Open Market Desk survey respondents assigned an average probability of 80 percent to that outcome.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3801, "text": "The private-sector job openings rate in January\u00e2\u0080\u0094as measured by the Job Openings and Labor Turnover Survey\u00e2\u0080\u0094was little changed, on balance, since November and remained high.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 3890, "text": "At the same time, though, participants noted that job gains had picked up in recent months and were running at a robust pace; the unemployment rate had remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11615, "text": "Wage growth continues to show signs of moderation.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11246, "text": "Global economic growth continues to slow, with inflation easing gradually across most economies.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4028, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7706, "text": "In contrast, amid improving economic conditions, the Bank of Japan increased its policy rate, taking a further step in gradually removing policy accommodation.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11448, "text": "These factors have all combined to bring inflation down.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11079, "text": "Strong population gains are adding to labour supply and supporting employment growth while also boosting aggregate consumption.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 560, "text": "Participants generally supported the plan to implement reductions in the pace of net purchases of Treasury securities and agency MBS by $10 billion and $5 billion per month, respectively, over the upcoming intermeeting period and judged that similar reductions in the pace would likely be appropriate in each subsequent month.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11582, "text": "The Bank\u2019s preferred measures of core inflation remain above 2%, mainly because of the persistence of shelter price inflation.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11300, "text": "The Bank expects the global economy to continue growing at a rate of about 3%, with inflation in most advanced economies easing gradually.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4022, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4210, "text": "In addition, some participants noted that their District contacts reported less difficulty in hiring, lower turnover rates, and some layoffs.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 639, "text": "The Committee judges that similar reductions in the pace of net asset purchases will likely be appropriate each month, but it is prepared to adjust the pace of purchases if warranted by changes in the economic outlook.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6034, "text": "Participants noted mixed reports about the pace of homebuilding amid still-elevated financing costs for developers, despite strong housing demand and a limited supply of affordable housing.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11136, "text": "New construction and real estate listings are lagging demand, which is adding pressure to prices.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11161, "text": "With ongoing weakness in the property sector undermining confidence, growth prospects in China have diminished.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 3179, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 5224, "text": "A couple of these participants commented that the aggregate household sector may have more financial resources than previously thought, which could help account for the strength in spending.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11278, "text": "Inflation in the United States and the euro area continued to ease.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 8099, "text": "At the conclusion of the discussion, the Committee voted to direct the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the SOMA in accordance with the following domestic policy directive, for release at 2:00 p.m.: \"Effective March 20, 2025, the Federal Open Market Committee directs the Desk to: The vote also encompassed approval of the statement below for release at 2:00 p.m.: \"Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5905, "text": "Nevertheless, taking into account the experience around the end of the 2017\u00e2\u0080\u009319 balance sheet runoff episode, participants broadly assessed it would be appropriate to take a cautious approach to further runoff.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6371, "text": "June 12, 2024 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10779, "text": "In Canada, GDP growth in the second half of 2021 now looks to have been even stronger than expected.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10958, "text": "In the United States, labour markets remain very tight even as restrictive financial conditions are slowing economic activity.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11177, "text": "With recent evidence that excess demand in the economy is easing, and given the lagged effects of monetary policy, Governing Council decided to hold the policy interest rate at 5% and continue to normalize the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10705, "text": "The Bank's QE program continues to reinforce this commitment and keep interest rates low across the yield curve.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6542, "text": "A few participants remarked that spending by some higher-income households was likely being bolstered by increasing asset prices.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11677, "text": "US CPI inflation ticked up in June with some evidence that tariffs are starting to be passed on to consumer prices.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11054, "text": "This should moderate wage growth and also increase competitive pressures, making it more difficult for businesses to pass on higher costs to consumers.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11202, "text": "The subsequent pickup is driven by household spending as well as stronger exports and business investment in response to improving foreign demand.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 3666, "text": "Participants agreed that the risks to the outlook for economic activity were weighted to the downside.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11173, "text": "After easing to 2.8% in June, CPI inflation moved up to 3.3% in July, averaging close to 3% in line with the Bank\u2019s projection.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 343, "text": "The Committee judges that similar reductions in the pace of net asset purchases will likely be appropriate each month, but it is prepared to adjust the pace of purchases if warranted by changes in the economic outlook.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4708, "text": "However, the staff continued to expect that real GDP growth in 2024 and 2025 would run below their estimate of potential output growth, leading to a small increase in the unemployment rate relative to its current level.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11097, "text": "The Bank of Canada today increased its target for the overnight rate to 4\u00be%, with the Bank Rate at 5% and the deposit rate at 4\u00be%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10995, "text": "Three-month rates of change in core inflation have come down, an early indicator that price pressures may be losing momentum.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11303, "text": "The euro area is projected to gradually recover from current weak growth.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8459, "text": "Once the debt limit was addressed, however, the TGA was likely to be rebuilt fairly quickly, which would drain liquidity from the system and result in fast declines in both ON RRP and reserve balances.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 10700, "text": "Wage increases have been moderate to date, and medium-term inflation expectations remain well-anchored.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 4389, "text": "By contrast, core inflation had yet to materially decline from its recent highs in many economies.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4831, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4020, "text": "Tighter credit conditions for households and businesses are likely to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 1672, "text": "Several participants judged that the upside risk to inflation associated with the war appeared more significant than the downside risk to growth, as inflation was already high, the United States had a relatively low level of financial and trade exposure to Russia, and the U.S. economy was well positioned to absorb additional adverse demand shocks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2916, "text": "The market-implied path of the policy rate rose, with the median federal funds rate values in the September Summary of Economic Projections and other Federal Reserve communications being viewed by market participants as indicating a commitment to sustaining a restrictive monetary policy stance.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11470, "text": "In contrast, consumer spending and housing activity both picked up, suggesting lower interest rates are beginning to boost household spending.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11481, "text": "Since October, the upward pressure on inflation from shelter and the downward pressure from goods prices have both moderated as expected.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11216, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5576, "text": "Inflation has eased over the past year but remains elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7352, "text": "December 18, 2024 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11211, "text": "In the Bank\u2019s October projection, CPI inflation is expected to average about 3\u00bd% through the middle of next year before gradually easing to 2% in 2025.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10894, "text": "The Bank of Canada today increased its target for the overnight rate to 2\u00bd%, with the Bank Rate at 2\u00be% and the deposit rate at 2\u00bd%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4167, "text": "Recent data for core PCE goods prices and the ECI measure of wage growth\u00e2\u0080\u0094the latter of which importantly influences the staff's projection of core nonhousing services inflation\u00e2\u0080\u0094came in above expectations, and the staff judged that supply\u00e2\u0080\u0093demand imbalances in both goods markets and labor markets were easing a bit more slowly than anticipated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11423, "text": "The Bank is continuing its policy of balance sheet normalization.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2498, "text": "Participants noted that a period of below-trend GDP growth would help reduce inflationary pressures and set the stage for the sustained achievement of the Committee's objectives of maximum employment and price stability.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11654, "text": "The labour market has weakened, particularly in trade-intensive sectors, and unemployment has risen to 6.9%.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 2221, "text": "With supply challenges still widespread, contacts continued to assess that supply constraints overall were significant, and many of them judged that these constraints were likely to persist for some time.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3319, "text": "With all these changes, output was expected to move below the staff's estimate of potential near the end of 2024\u00e2\u0080\u0094a year later than in the previous forecast\u00e2\u0080\u0094and to remain below potential in 2025.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 2331, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 556, "text": "The unemployment rate had declined to 4.8 percent in September\u00e2\u0080\u0094about 2 percentage points lower than the level last December\u00e2\u0080\u0094and job openings and other indicators also were pointing to widespread strength in labor demand, consistent with a broad improvement in labor market conditions.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11168, "text": "Household credit growth slowed as the impact of higher rates restrained spending among a wider range of borrowers.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 3124, "text": "A few participants commented that slowing the pace of increase could reduce the risk of instability in the financial system.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 11440, "text": "Residential investment growth is also projected to rise as strong demand for housing li
