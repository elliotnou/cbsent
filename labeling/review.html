k": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11755, "text": "Growth in the euro area is decelerating due to weaker exports and slowing domestic demand.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 9159, "text": "For media inquiries, please email [email protected] or call 202-452-2955.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11829, "text": "Economic growth is projected to be modest in the near term as population growth slows and Canada adjusts to US protectionism.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11741, "text": "how much this spills over into business investment, employment, and household spending", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10656, "text": "The Bank projects global GDP growth will slow to 2\u00be% in 2026, mostly because of the effects of the Middle East conflict, and recover to around 3\u00bc% in 2027 and 2028.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10150, "text": "For media inquiries, please email [email protected] or call 202-452-2955.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9448, "text": "For media inquiries, please email [email protected] or call 202-452-2955.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9926, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10678, "text": "Inflation is forecast to average around 2% in 2027 and 2028, albeit with some monthly fluctuations because of base-year effects.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9148, "text": "Uncertainty about the economic outlook remains elevated.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11805, "text": "In the near term, CPI inflation is likely to be higher due to the effects of last year\u2019s GST/HST holiday on the prices of some goods and services.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11744, "text": "We will support economic growth while ensuring inflation remains well controlled.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9094, "text": "In discussing risk-management considerations that could bear on the outlook for monetary policy, participants generally judged that upside risks to inflation remained elevated and that downside risks to employment were elevated and had increased.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10642, "text": "The Bank is committed to maintaining Canadians\u2019 confidence in price stability through this period of global upheaval.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9637, "text": "Participants judged that a careful balancing of risks was required and agreed on the importance of well-anchored longer-term inflation expectations in achieving the Committee's dual-mandate objectives.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9596, "text": "Participants generally viewed the low dynamism in the labor market as reflecting both lower labor demand amid economic uncertainty or efforts by businesses to contain costs and decreased labor supply associated with lower immigration, the aging of the population, or reduced labor force participation.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10646, "text": "Canada\u2019s economy is showing signs of improvement.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10564, "text": "Attended Wednesday's session only.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10509, "text": "Participants generally expected labor market conditions to remain stable in the near term, with the unemployment rate staying close to current levels.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 9809, "text": "The amount of total short-run funding instruments and cash-management vehicles as a fraction of GDP remained in the middle of its historical range, uninsured deposits at banks were likewise within historical norms, and funding risks associated with nontraditional short-term liabilities at life insurance companies were low.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11742, "text": "how the cost effects of trade disruptions and reconfigured supply chains are passed on to consumer prices; and how inflation expectations evolve.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10322, "text": "Many participants mentioned the importance of addressing cybersecurity risks.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11821, "text": "Global financial conditions have remained accommodative overall.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 8815, "text": "Some participants remarked, however, that slower output or employment growth was not necessarily indicative of emerging economic slack because a decline in immigration was lowering both actual and potential output growth as well as reducing both actual payroll growth and the number of new jobs needed to keep the unemployment rate stable.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 10419, "text": "Consistent with the widening interest rate gap over the intermeeting period, the foreign exchange value of the U.S. dollar had modestly appreciated.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10652, "text": "The path for global inflation is highly dependent on how the conflict unfolds.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9797, "text": "Delinquency rates on small business and CMBS loans were little changed in November and remained elevated relative to pre-pandemic levels.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8736, "text": "The broad dollar index was little changed on net.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11769, "text": "The Bank projects GDP will grow by 1.2% in 2025, 1.1% in 2026 and 1.6% in 2027.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10402, "text": "Regarding monetary policy expectations, the manager observed that market participants and respondents to the Open Market Desk Survey of Market Expectations (Desk survey) generally expected no change in the target range of the federal funds rate at the June FOMC meeting.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11756, "text": "In China, lower exports to the United States have been offset by higher exports to other countries, but business investment has weakened.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10426, "text": "By unanimous vote, the Committee ratified the Desk's domestic transactions over the intermeeting period.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10019, "text": "Credit continued to be generally available to most businesses, households, and municipalities.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11763, "text": "Growth will get some support from rising consumer and government spending and residential investment, and then pick up gradually as exports and business investment begin to recover.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11720, "text": "China\u2019s economy held up in the first half of the year but growth appears to be softening as investment weakens.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10001, "text": "Some measures of near-term inflation expectations increased, as energy and other commodity prices surged with the Middle East conflict.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11797, "text": "The Bank expects final domestic demand will grow in the fourth quarter, but with an anticipated decline in net exports, GDP will likely be weak.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 9588, "text": "A few participants remarked that measures of near-term inflation expectations had been elevated earlier in 2025 but had declined from those peaks.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10446, "text": "Recent indicators suggested that the conflict in the Middle East was weighing on foreign economic activity because of higher energy costs and weaker consumer and business confidence, particularly in lower-income Asian economies and in Europe.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8934, "text": "Voting against this action was Stephen I. Miran, who preferred to lower the target range for the federal funds rate by 1/2 percentage point at this meeting.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 8708, "text": "Disinflation appeared to have stalled, with tariffs putting upward pressure on goods price inflation.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8890, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10148, "text": "Voting against this action were Stephen I. Miran, who preferred to lower the target range for the federal funds rate by 1/4 percentage point at this meeting", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11867, "text": "Food inflation slowed in February but remains elevated.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9698, "text": "The Committee's assessments will take into account a wide range of information, including readings on labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11786, "text": "The Bank\u2019s next MPR will be released on January 28, 2026.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10580, "text": "The Iran war has led to sharply higher energy prices and transportation disruptions, diminishing growth prospects in oil-importing countries and boosting inflation worldwide.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11777, "text": "With ongoing weakness in the economy and inflation expected to remain close to the 2% target, Governing Council decided to cut the policy rate by 25 basis points.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10609, "text": "Governing Council is looking through the war\u2019s immediate impact on inflation but will not let higher energy prices become persistent inflation.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 9222, "text": "Many participants indicated that a greater share of Treasury bills could provide the Federal Reserve with more flexibility to accommodate changes in the demand for reserves or changes in nonreserve liabilities and thereby help to maintain an ample level of reserves.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 8979, "text": "The ratio of job vacancies to unemployed workers was 1.0 in August and remained within the narrow range seen over the past year.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 8902, "text": "Beth M. Hammack, Neel Kashkari, Lorie K. Logan, Anna Paulson, and Sushmita Shukla, Alternate Members of the Committee Thomas I. Barkin, Raphael W. Bostic, and Mary C. Daly, Presidents of the Federal Reserve Banks of Richmond, Atlanta, and San Francisco, respectively Joshua Gallin, Secretary Matthew M. Luecke, Deputy Secretary Brian J. Bonis, Assistant Secretary Michelle A. Smith, Assistant Secretary Mark E. Van Der Weide, General Counsel Richard Ostrander, Deputy General Counsel Trevor A. Reeve, Economist Stacey Tevlin, Economist Beth Anne Wilson, 2 Economist Shaghil Ahmed, Kartik B. Athreya, Brian M. Doyle, Eric M. Engen, Carlos Garriga, Joseph W. Gruber, and Egon Zakraj\u00c5\u00a1ek, Associate Economists Roberto Perli, Manager, System Open Market Account Julie Ann Remache, Deputy Manager, System Open Market Account Jose Acosta, Senior System Engineer II, Division of Information Technology, Board Isaiah C. Ahn, Information Management Analyst, Division of Monetary Affairs, Board Mary L. Aiken, Senior Associate Director, Division of Supervision and Regulation, Board Gianni Amisano, Assistant Director, Division of Research and Statistics, Board Roc Armenter, Executive Vice President, Federal Reserve Bank of Philadelphia David M. Arseneau, Deputy Associate Director, Division of Financial Stability, Board Alyssa Arute, 3 Assistant Director, Division of Reserve Bank Operations and Payment Systems, Board William F. Bassett, Senior Associate Director, Division of Financial Stability, Board Michele Cavallo, Special Adviser to the Board, Division of Board Members, Board Andrew Cohen, 4 Special Adviser to the Board, Division of Board Members, Board Daniel M. Covitz, Deputy Director, Division of Research and Statistics, Board Marnie Gillis DeBoer, 3 Senior Associate Director, Division of Monetary Affairs, Board Wendy E. Dunn, Adviser, Division of Research and Statistics, Board Eric C. Engstrom, Associate Director, Division of Monetary Affairs, Board Laura J. Feiveson, 5 Special Adviser to the Board, Division of Board Members, Board Andrew Figura, Associate Director, Division of Research and Statistics, Board Glenn Follette, Associate Director, Division of Research and Statistics, Board Etienne Gagnon, Senior Associate Director, Division of International Finance, Board Jonathan Glicoes, Senior Financial Institution Policy Analyst II, Division of Monetary Affairs, Board Valerie S. Hinojosa, Section Chief, Division of Monetary Affairs, Board Jane E. Ihrig, Special Adviser to the Board, Division of Board Members, Board Margaret M. Jacobson, Senior Economist, Division of Monetary Affairs, Board Michael T. Kiley, Deputy Director, Division of Monetary Affairs, Board Don H. Kim, Senior Adviser, Division of Monetary Affairs, Board Elizabeth Klee, Deputy Director, Division of Monetary Affairs, Board Anna R. Kovner, Executive Vice President, Federal Reserve Bank of Richmond Spencer D. Krane, Senior Vice President, Federal Reserve Bank of Chicago Sylvain Leduc, Executive Vice President and Director of Economic Research, Federal Reserve Bank of San Francisco Andreas Lehnert, Director, Division of Financial Stability, Board Kurt F. Lewis, Special Adviser to the Chair, Division of Board Members, Board Logan T. Lewis, Section Chief, Division of International Finance, Board Geng Li, Assistant Director, Division of Research and Statistics, Board Laura Lipscomb, Special Adviser to the Board, Division of Board Members, Board Benjamin W. McDonough, Deputy Secretary and Ombudsman, Office of the Secretary, Board Neil Mehrotra, Assistant Vice President, Federal Reserve Bank of Minneapolis Ann E. Misback, 6 Secretary, Office of the Secretary, Board David Na, Lead Financial Institution Policy Analyst, Division of Monetary Affairs, Board Edward Nelson, Senior Adviser, Division of Monetary Affairs, Board Anna Nordstrom, Head of Markets, Federal Reserve Bank of New York Alyssa T. O'Connor, Special Adviser to the Board, Division of Board Members, Board Ekaterina Peneva, Assistant Director and Chief, Division of Research and Statistics, Board Caterina Petrucco-Littleton, Special Adviser to the Board, Division of Board Members, Board Damjan Pfajfar, Vice President, Federal Reserve Bank of Cleveland Eugenio P. Pinto, Special Adviser to the Board, Division of Board Members, Board Jordan Pollinger, 3 Associate Director, Federal Reserve Bank of New York Fabiola Ravazzolo, 3 Capital Markets Trading and Policy Advisor, Federal Reserve Bank of New York Kirk Schwarzbach, 7 Special Assistant to the Board, Division of Board Members, Board Zeynep Senyuz, Special Adviser to the Board, Division of Board Members, Board Thiago Teixeira Ferreira, Special Adviser to the Board, Division of Board Members, Board Mary H. Tian, Group Manager, Division of Monetary Affairs, Board Annette Vissing-J\u00f8rgensen, Senior Adviser, Division of Monetary Affairs, Board Jeffrey D. Walker, 3 Senior Associate Director, Division of Reserve Bank Operations and Payment Systems, Board Jonathan Willis, Vice President, Federal Reserve Bank of Atlanta Rebecca Zarutskie, Senior Vice President, Federal Reserve Bank of Dallas _______________________ Joshua Gallin Secretary 1.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11766, "text": "Job losses continue to build in trade-sensitive sectors and hiring has been weak across the economy.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 10011, "text": "Sovereign credit spreads widened in many emerging market economies, especially in those economies most reliant on energy imports.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10658, "text": "US bond yields have risen, while those in Canada are little changed.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11775, "text": "Expanding the range of indicators to include alternative measures of core inflation and the distribution of price changes among CPI components suggests underlying inflation remains around 2\u00bd%.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 9298, "text": "By contrast, banks remained resilient, with high regulatory capital ratios and improved funding structure, although their market-adjusted capital ratios remained depressed and sensitive to long-term interest rates.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11818, "text": "In the euro area, growth has been supported by activity in service sectors and will get additional support from fiscal policy.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10158, "text": "The manager noted, however, that the curve's forecasting record was mixed.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 9694, "text": "In considering the extent and timing of additional adjustments to the target range for the federal funds rate, the Committee will carefully assess incoming data, the evolving outlook, and the balance of risks.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9930, "text": "Voting against this action was Stephen I. Miran, who preferred to lower the target range for the federal funds rate by 1/4 percentage point at this meeting.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11733, "text": "Excluding taxes, inflation was 2.4%.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11801, "text": "Nevertheless, job markets in trade-sensitive sectors remain weak and economy-wide hiring intentions continue to be subdued.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11877, "text": "The Bank\u2019s next MPR will be released at the same time.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11765, "text": "Employment gains in September followed two months of sizeable losses.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11730, "text": "Job losses have largely been concentrated in trade-sensitive sectors, while employment growth in the rest of the economy has slowed, reflecting weak hiring intentions.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11819, "text": "China\u2019s GDP growth is expected to slow gradually, as weakening domestic demand offsets strength in exports.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 9687, "text": "January 28, 2026 Available indicators suggest that economic activity has been expanding at a solid pace.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11740, "text": "Governing Council will be assessing how exports evolve in the face of US tariffs and changing trade relationships", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10607, "text": "Against this backdrop and taking into account the current projection, Governing Council decided to maintain the policy rate at 2.25%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11746, "text": "The Bank\u2019s October Monetary Policy Report will be released at the same time.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10576, "text": "The Bank of Canada today held its target for the overnight rate at 2.25%, with the Bank Rate at 2.5% and the deposit rate at 2.20%.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10250, "text": "Although the default rate for leveraged loans remained elevated, market-implied measures of year-ahead expected defaults were below the median of their post-GFC distributions.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11840, "text": "If the outlook changes, we are prepared to respond.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 9100, "text": "Nevertheless, with reserves declining and expected to decline further, they noted that it was important to continue to monitor money market conditions closely and evaluate how close reserves were to their ample level.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11731, "text": "The unemployment rate has moved up since March, hitting 7.1% in August, and wage growth has continued to ease.", "bank": "BOC", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11825, "text": "After a strong third quarter, GDP growth in the fourth quarter likely stalled.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 8682, "text": "Perceived risks associated with trade policy developments contributed to an increase in near-term market measures of inflation compensation, while longer-horizon measures of inflation compensation rose more modestly.", "bank": "FED", "year": 2025, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10468, "text": "Bank lending continued to expand, and issuance of corporate bonds remained solid, partly driven by the financing needs of AI-related investments.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 10602, "text": "The proportion of components of the CPI basket rising above 3% has also declined in recent months.", "bank": "BOC", "year": 2026, "in_eval": true, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 10335, "text": "With regard to the outlook for monetary policy, participants generally judged that the continued elevated inflation readings together with uncertainty related to the duration and economic implications of the Middle East conflict could necessitate maintaining the current policy stance for longer than previously anticipated.", "bank": "FED", "year": 2026, "in_eval": true, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 32, "text": "Domestic financial conditions were little changed, on net, and remained highly accommodative.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 10929, "text": "The effects of COVID-19 outbreaks, ongoing supply disruptions, and the war in Ukraine continue to dampen growth and boost prices.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11604, "text": "In the United States, the economy is showing signs of slowing amid rising policy uncertainty and rapidly deteriorating sentiment, while inflation expectations have risen.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11015, "text": "Labour markets are still tight: the unemployment rate is near historic lows and businesses are reporting ongoing difficulty finding workers.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11641, "text": "In the United States, domestic demand remained relatively strong but higher imports pulled down first-quarter GDP.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11441, "text": "Business investment is expected to strengthen as demand picks up, and exports should remain strong, supported by robust demand from the United States.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 5582, "text": "The Committee does not expect it will be appropriate to reduce the target range until it has gained greater confidence that inflation is moving sustainably toward 2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10760, "text": "Gasoline prices, which had been a major factor pushing up CPI inflation, have recently declined.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10762, "text": "The Bank continues to expect CPI inflation to remain elevated in the first half of 2022 and ease back towards 2 percent in the second half of the year.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11571, "text": "Past cuts to interest rates have boosted economic activity, particularly consumption and housing.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5377, "text": "Consumer price inflation had eased over the past year but remained elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11270, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10911, "text": "Consumption is robust, led by a rebound in spending on hard-to-distance services.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11689, "text": "Labour market conditions have weakened in sectors affected by trade, but employment has held up in other parts of the economy.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11329, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1182, "text": "Principles for Reducing the Size of the Balance Sheet Participants continued their discussion of topics associated with potential adjustments in the Committee's policy tools that may be appropriate to support the achievement of sustained strong labor market conditions and a return of inflation to levels consistent with the Committee's longer-run 2 percent objective under a wide range of circumstances.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11295, "text": "The Bank remains resolute in its commitment to restoring price stability for Canadians.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6373, "text": "Inflation has eased over the past year but remains elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5712, "text": "Staff Economic Outlook The economic forecast prepared by the staff for the January meeting was slightly stronger than the December projection, as the upward revision to 2023 GDP growth implied by incoming data boosted the level of output throughout the projection period.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10689, "text": "However, supply chain disruptions are restraining activity in some sectors and rising cases of COVID-19 in many regions pose a risk to the strength of the global recovery.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10811, "text": "Economic growth in Canada was very strong in the fourth quarter of last year at 6.7%.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2550, "text": "These downside risks included the possibility that the tightening in financial conditions would have a larger negative effect on economic activity than anticipated, that there would be further pandemic-related economic disruptions, or that geopolitical and global economic developments would lead to additional adverse economic or financial disturbances.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5954, "text": "Foreign headline inflation picked up early in the year as the downward pressure from previous energy price declines waned and some emerging market economies (EMEs) experienced renewed food price pressures due to adverse weather.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 626, "text": "With progress on vaccinations and strong policy support, indicators of economic activity and employment have continued to strengthen.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11337, "text": "In the euro area, activity picked up in the first quarter of 2024.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2898, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10715, "text": "In the face of strong global demand for goods, pandemic-related disruptions to production and transportation are constraining growth.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11024, "text": "Inflation has declined from 8.1% in June to 6.3% in December, reflecting lower gasoline prices and, more recently, moderating prices for durable goods.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10851, "text": "Consumer spending is strengthening with the lifting of pandemic containment measures.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10906, "text": "Oil prices remain high and volatile.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11195, "text": "Weaker demand and higher borrowing costs are weighing on business investment.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 3235, "text": "Average hourly earnings rose 5.1 percent over the 12 months ending in November, close to the pace recorded in the employment cost index of hourly compensation in the private sector over the 12 months ending in September.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7049, "text": "In discussing risk-management considerations that could bear on the outlook for monetary policy, almost all participants agreed that the upside risks to inflation had diminished, and most remarked that the downside risks to employment had increased.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11238, "text": "With further signs that monetary policy is moderating spending and relieving price pressures, Governing Council decided to hold the policy rate at 5% and to continue to normalize the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6864, "text": "Inflation has made further progress toward the Committee's 2 percent objective but remains somewhat elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5013, "text": "All participants agreed that policy should remain restrictive for some time until the Committee is confident that inflation is moving down sustainably toward its objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11147, "text": "In the July MPR projection, CPI inflation is forecast to hover around 3% for the next year before gradually declining to 2% in the middle of 2025.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 4326, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11086, "text": "CPI inflation eased to 5.2% in February, and the Bank\u2019s preferred measures of core inflation were just under 5%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 8651, "text": "July 30, 2025 Although swings in net exports continue to affect the data, recent indicators suggest that growth of economic activity moderated in the first half of the year.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11276, "text": "US GDP growth also slowed but remained surprisingly robust and broad-based, with solid contributions from consumption and exports.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11369, "text": "In Canada, economic growth likely picked up to about 1\u00bd% through the first half of this year.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11148, "text": "This is a slower return to target than was forecast in the January and April projections.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10992, "text": "Overall, the data since the October MPR support the Bank\u2019s outlook that growth will essentially stall through the end of this year and the first half of next year.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10728, "text": "Although the impact and persistence of these supply factors are hard to quantify, the output gap is likely to be narrower than the Bank had forecast in July.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11519, "text": "The Bank forecasts CPI inflation will be around the 2% target over the next two years.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11344, "text": "Consumption growth was solid at about 3%, and business investment and housing activity also increased.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10960, "text": "In the euro area, the economy is forecast to contract in the quarters ahead, largely due to acute energy shortages.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6141, "text": "The dollar strengthened as several foreign central banks were expected to start easing policy before the Federal Reserve.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11320, "text": "The strengthening economy will gradually absorb excess supply through 2025 and into 2026.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11542, "text": "Beginning in early March, the Bank will begin purchasing assets as part of normal balance sheet management.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 5214, "text": "Participants judged that the current stance of monetary policy was restrictive and was putting downward pressure on economic activity and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8443, "text": "The manager observed that the rise in shorter-maturity yields was consistent with the upward shift in the expected policy rate path.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3450, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 2904, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11350, "text": "Indicators of the breadth of price increases across components of the CPI have moved down further and are near their historical average.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11234, "text": "The slowdown in the economy is reducing inflationary pressures in a broadening range of goods and services prices.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4994, "text": "the possibility that the economic slowdown in China could result in a drag on global economic growth", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6305, "text": "Participants assessed that maintaining the current target range for the federal funds rate at this meeting was supported by intermeeting data indicating continued solid economic growth and a lack of further progress toward the Committee's 2 percent inflation objective in recent months.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11067, "text": "Inflation in many countries is easing in the face of lower energy prices, normalizing global supply chains, and tighter monetary policy.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11409, "text": "The labour market continues to slow, with little change in employment in recent months.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11551, "text": "Treasury bill purchases will resume later this year and be conducted via GoC auctions.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11292, "text": "Governing Council decided to hold the policy rate at 5% and to continue to normalize the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 931, "text": "They agreed that the inflation criteria in the guidance had been met and that the postmeeting statement should note that with inflation having exceeded 2 percent for some time, the Committee expected that it would be appropriate to maintain the current target range of 0 to 1/4 percent until labor market conditions had reached levels consistent with the Committee's assessments of maximum employment.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 1358, "text": "A couple of these participants judged that prolonged accommodative financial conditions could be contributing to financial imbalances.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "financial_stability"}, {"id": 11017, "text": "Consumption growth has moderated from the first half of 2022 and housing market activity has declined substantially.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7307, "text": "Some participants judged that downside risks to economic activity or the labor market had diminished.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 4320, "text": "The Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1922, "text": "Against this background, participants stated that they were highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5514, "text": "In discussing the policy outlook, participants viewed the policy rate as likely at or near its peak for this tightening cycle, though they noted that the actual policy path will depend on how the economy evolves.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 342, "text": "Beginning in December, the Committee will increase its holdings of Treasury securities by at least $60 billion per month and of agency mortgage-backed securities by at least $30 billion per month.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 491, "text": "However, the level of real GDP was expected to remain well above potential throughout the projection period, and the unemployment rate was expected to decline to historically low levels.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 10814, "text": "In January, the recovery in Canada\u2019s labour market suffered a setback due to the Omicron variant, with temporary layoffs in service sectors and elevated employee absenteeism.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 6461, "text": "Changes in AFE yields were mixed, as spillovers from declines in U.S. yields were partly offset by upside surprises in economic data releases in Europe and by somewhat more restrictive-than-expected communications by the ECB.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 10725, "text": "Demand is expected to be supported by strong consumption and business investment, and a rebound in exports as the US economy continues to recover.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11559, "text": "The Canadian economy entered 2025 in a solid position, with inflation close to the 2% target and robust GDP growth.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11143, "text": "While CPI inflation has come down largely as expected so far this year, the downward momentum has come more from lower energy prices, and less from easing underlying inflation.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11545, "text": "As such, the Bank will restart its term repo program effective March 5, 2025 and operations will be conducted every two weeks.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 901, "text": "All participants remarked that inflation had continued to run notably above 2 percent, reflecting supply and demand imbalances related to the pandemic and the reopening of the economy.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1307, "text": "In particular, the possibility that the economic effects of the virus would turn out to be larger than assumed in the baseline projection was viewed as an important source of downside risk to activity, while the possibility of more severe and more persistent supply issues was viewed as an additional downside risk to activity and as an upside risk to inflation.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10737, "text": "We will continue to provide the appropriate degree of monetary policy stimulus to support the recovery and achieve the inflation target.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 3453, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 327, "text": "November 03, 2021 The Federal Reserve is committed to using its full range of tools to support the U.S. economy in this challenging time, thereby promoting its maximum employment and price stability goals.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11648, "text": "In Canada, economic growth in the first quarter came in at 2.2%, slightly stronger than the Bank had forecast, while the composition of GDP growth was largely as expected.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11144, "text": "With the large price increases of last year out of the annual data, there will be less near-term downward momentum in CPI inflation.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11473, "text": "Wage growth showed some signs of easing, but remains elevated relative to productivity.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10730, "text": "Core measures of inflation have also risen, but by less than the CPI.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 5849, "text": "The economic outlook is uncertain, and the Committee remains highly attentive to inflation risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10776, "text": "As well, oil prices have rebounded to well above pre-pandemic levels following a decline at the onset of the Omicron variant of COVID-19.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11, "text": "The Committee decided to keep the target range for the federal funds rate at 0 to 1/4 percent and expects it will be appropriate to maintain this target range until labor market conditions have reached levels consistent with the Committee's assessments of maximum employment and inflation has risen to 2 percent and is on track to moderately exceed 2 percent for some time.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 4318, "text": "Tighter credit conditions for households and businesses are likely to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 3688, "text": "Participants observed that a restrictive policy stance would need to be maintained until the incoming data provided confidence that inflation was on a sustained downward path to 2 percent, which was likely to take some time.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11284, "text": "Consumption was up a modest 1%, and final domestic demand contracted with a large decline in business investment.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2660, "text": "In money markets, the 75 basis point increase in the target range at the July meeting passed through fully to overnight rates.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 981, "text": "The Committee decided to continue to reduce the monthly pace of its net asset purchases, bringing them to an end in early March.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11522, "text": "With inflation around 2% and the economy in excess supply, Governing Council decided to reduce the policy rate a further 25 basis points to 3%.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 10876, "text": "The Bank will use its monetary policy tools to return inflation to target and keep inflation expectations well anchored.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5516, "text": "Several participants remarked that the Committee's past policy actions were having their intended effect of helping to slow the growth of aggregate demand and cool labor market conditions.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11652, "text": "Housing activity was down, driven by a sharp contraction in resales.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 3603, "text": "In part reflecting the lagged effects of previous monetary policy tightening, the staff still projected real GDP growth to slow markedly this year and the labor market to soften.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11080, "text": "Housing market activity remains subdued.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11385, "text": "Inflation is also elevated in services that are closely affected by wages, such as restaurants and personal care.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11513, "text": "However, with slower population growth because of reduced immigration targets, both GDP and potential growth will be more moderate than was expected in October.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11105, "text": "Canada\u2019s economy was stronger than expected in the first quarter of 2023, with GDP growth of 3.1%.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11696, "text": "Excluding taxes, inflation rose to 2.5% in June, up from around 2% in the second half of last year.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10882, "text": "US labour market strength continues, with wage pressures intensifying.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5816, "text": "Members also agreed to note the progress made toward the 2 percent inflation objective and the resilience of economic activity over the past year by stating that the Committee \"judges that the risks to achieving its employment and inflation goals are moving into better balance.\" Regarding considerations relevant for future policy actions, members agreed, given their assessment of the policy rate being likely at its peak for this tightening cycle, to remove the reference to \"the extent of any additional policy firming that may be appropriate to return inflation to 2 percent over time,\" as was included in the December statement.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 8404, "text": "June 18, 2025 Although swings in net exports have affected the data, recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11617, "text": "The higher inflation in the last couple of months reflects some rebound in goods price inflation and the end of the temporary suspension of the GST/HST.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11455, "text": "However, the timing and pace of further reductions in the policy rate will be guided by incoming information and our assessment of its implications for the inflation outlook.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11702, "text": "As the alternative scenarios illustrate, lower tariffs would reduce the direct upward pressure on inflation and higher tariffs would increase it.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11370, "text": "However, with robust population growth of about 3%, the economy\u2019s potential output is still growing faster than GDP, which means excess supply has increased.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11371, "text": "Household spending, including both consumer purchases and housing, has been weak.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8168, "text": "The manager noted that respondents to the Open Market Desk's Survey of Market Expectations had materially lowered their gross domestic product (GDP) forecasts and raised their inflation forecasts for this year while significantly increasing the probability they placed on a recession occurring within the next six months.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11510, "text": "Job growth has strengthened in recent months, after lagging growth in the labour force for more than a year.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11353, "text": "Recent data has increased our confidence that inflation will continue to move towards the 2% target.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 14, "text": "If progress continues broadly as expected, the Committee judges that a moderation in the pace of asset purchases may soon be warranted.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11388, "text": "As those effects wear off, CPI inflation may edge up again before settling around the 2% target next year.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7529, "text": "Participants also observed that recent indicators suggested that economic activity had continued to expand at a solid pace, labor market conditions had generally eased since earlier in the year, and the unemployment rate had moved up but remained low.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11141, "text": "The economy will move into modest excess supply early next year before growth picks up to 2.4% in 2025.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6866, "text": "The Committee has gained greater confidence that inflation is moving sustainably toward 2 percent, and judges that the risks to achieving its employment and inflation goals are roughly in balance.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 637, "text": "In light of inflation developments and the further improvement in the labor market, the Committee decided to reduce the monthly pace of its net asset purchases by $20 billion for Treasury securities and $10 billion for agency mortgage-backed securities.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4171, "text": "With expected declines in consumer energy prices and a substantial moderation in food price inflation, total inflation was projected to run below core inflation this year and next.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 10691, "text": "In Canada, GDP contracted by about 1 percent in the second quarter, weaker than anticipated in the Bank\u2019s July Monetary Policy Report (MPR).", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10905, "text": "China\u2019s economy is being held back by waves of restrictive measures to contain COVID-19 outbreaks.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6862, "text": "September 18, 2024 Recent indicators suggest that economic activity has continued to expand at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 4738, "text": "Participants judged that, over coming quarters, firms would reduce the pace of their investment spending and hiring in response to tight financial conditions and the slowing of economic activity.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 7300, "text": "Participants judged that it was appropriate to continue the process of reducing the Federal Reserve's securities holdings.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 5026, "text": "Many participants commented that even though economic activity had been resilient and the labor market had remained strong, there continued to be downside risks to economic activity and upside risks to the unemployment rate.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6624, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 10748, "text": "Accommodative financial conditions are still supporting economic activity.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 575, "text": "Progress on vaccinations and an easing of supply constraints were expected to support continued gains in economic activity and employment as well as a reduction in inflation, but risks to the economic outlook remained.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2014, "text": "The Committee is highly attentive to inflation risks.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1792, "text": "In global financial developments, many advanced-economy central banks raised policy rates over the period, and investors increasingly came to anticipate tighter monetary policy ahead in most advanced foreign economies.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3064, "text": "Participants remarked that the foreign economic slowdown, in combination with a strong U.S. dollar, was likely to weigh on the U.S. export sector, and several participants commented that there could be wider spillovers to the U.S. economy.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 10955, "text": "The strength of the US dollar is adding to inflationary pressures in many countries.", "bank": "BOC", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11112, "text": "Goods price inflation increased, despite lower energy costs.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6038, "text": "Reports from business contacts in some industries and Districts conveyed increased optimism about the outlook, while contacts in a couple of other Districts reported only a steady or stable pace of economic activity.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 3746, "text": "Recent developments are likely to result in tighter credit conditions for households and businesses and to weigh on economic activity, hiring, and inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 630, "text": "Overall financial conditions remain accommodative, in part reflecting policy measures to support the economy and the flow of credit to U.S. households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 11365, "text": "In the euro area, growth is picking up following a weak 2023.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "dovish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2629, "text": "Job gains have been robust in recent months, and the unemployment rate has remained low.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 2759, "text": "Likewise, the unemployment rate was expected to rise more slowly than in the July projection and to be slightly below the staff's estimate of its natural rate at the end of 2025.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 498, "text": "Participants' Views on Current Economic Conditions and the Economic Outlook In their discussion of current conditions, participants noted that, with progress on vaccinations and strong policy support, indicators of economic activity and employment had continued to strengthen.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 11040, "text": "In the United States and Europe, near-term outlooks for growth and inflation are both somewhat higher than expected in January.", "bank": "BOC", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 7933, "text": "Abstracting from the debt limit situation, with the ON RRP facility nearly depleted, portfolio runoff was likely to translate to lower reserves in the future.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11311, "text": "Employment has been growing more slowly than the working-age population and the unemployment rate has risen gradually, reaching 6.1% in March.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 3755, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2815, "text": "Several participants commented that while households across the income distribution were burdened by elevated inflation, those at the lower end of the income distribution were particularly harmed, as a larger share of their income was spent on housing and other necessities.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5802, "text": "Committee Policy Actions In their discussions of monetary policy for this meeting, members agreed that economic activity had been expanding at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11691, "text": "A number of economic indicators suggest excess supply in the economy has increased since January.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 5854, "text": "The Committee is strongly committed to returning inflation to its 2 percent objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3550, "text": "Sovereign yields increased notably in the euro area and Japan, reflecting more-restrictive-than-expected communications from the European Central Bank and the Bank of Japan's decision to widen its yield curve control target band, respectively.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2353, "text": "In the Desk surveys, respondents also expected inflation to decline substantially in 2023 but assigned meaningful probabilities to a wide range of potential outcomes, including scenarios involving continued elevated rates of inflation.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5846, "text": "Inflation has eased over the past year but remains elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3743, "text": "Job gains have picked up in recent months and are running at a robust pace; the unemployment rate has remained low.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 11362, "text": "While inflation is still above central bank targets in most advanced economies, it is forecast to ease gradually.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4825, "text": "September 20, 2023 Recent indicators suggest that economic activity has been expanding at a solid pace.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": true, "dict_stance": "hawkish", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 10752, "text": "Persistent supply bottlenecks continued to inhibit growth in other components of GDP, including non-commodity exports and business investment.", "bank": "BOC", "year": 2021, "in_eval": false, "disagree": true, "dict_stance": "neutral", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 8466, "text": "The manager noted that, starting on June 26, the
