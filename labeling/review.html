", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11443, "text": "As the economy strengthens, excess supply is gradually absorbed.", "bank": "BOC", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11612, "text": "Consumption, residential investment and business spending all look to have weakened in the first quarter.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11655, "text": "The economy is expected to be considerably weaker in the second quarter, with the strength in exports and inventories reversing and final domestic demand remaining subdued.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11707, "text": "If a weakening economy puts further downward pressure on inflation and the upward price pressures from the trade disruptions are contained, there may be a need for a reduction in the policy interest rate.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11509, "text": "Canada\u2019s labour market remains soft, with the unemployment rate at 6.7% in December.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11577, "text": "While past interest rate cuts have boosted demand for labour in recent months, there are warning signs that heightened trade tensions could disrupt the recovery in the jobs market.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11511, "text": "Wage pressures, which have proven sticky, are showing some signs of easing.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11544, "text": "Asset purchases will begin with the restart of the regular term repo program, followed by Government of Canada (GoC) treasury bill purchases to restore a more balanced mix of assets on the Bank\u2019s balance sheet.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11619, "text": "Lower global oil prices will also dampen inflation in the near term.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 11566, "text": "Equity prices have fallen and bond yields have eased on market expectations of weaker North American growth.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11524, "text": "Lower interest rates are boosting household spending and, in the outlook published today, the economy is expected to strengthen gradually and inflation to stay close to target.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11609, "text": "Oil prices have declined substantially since January, mainly reflecting weaker prospects for global growth.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11498, "text": "Growth in the euro area is likely to be subdued as the region copes with competitiveness pressures.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11614, "text": "Employment declined in March and businesses are reporting plans to slow their hiring.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 11493, "text": "The Bank will restart asset purchases in early March, beginning gradually so that its balance sheet stabilizes and then grows modestly, in line with growth in the economy.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 11687, "text": "This contraction is mostly due to a sharp reversal in exports following the pull-forward, as well as lower US demand for Canadian goods due to tariffs.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 11514, "text": "Following growth of 1.3% in 2024, the Bank now projects GDP will grow by 1.8% in both 2025 and 2026, somewhat higher than potential growth.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11587, "text": "What it can and must do is ensure that higher prices do not lead to ongoing inflation.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11704, "text": "These costs could add upward pressure to consumer prices.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11560, "text": "However, heightened trade tensions and tariffs imposed by the United States will likely slow the pace of economic activity and increase inflationary pressures in Canada.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11594, "text": "The major shift in direction of US trade policy and the unpredictability of tariffs have increased uncertainty, diminished prospects for economic growth, and raised inflation expectations.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11534, "text": "Adjusting the deposit rate should also help mitigate some of the upward pressure that has been seen on the overnight rate relative to the Bank\u2019s target rate in recent months and help reinforce the effect of the Bank\u2019s Overnight Repo (OR) operations.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 11563, "text": "US inflation remains slightly above target.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11622, "text": "Short-term inflation expectations have moved up, as businesses and consumers anticipate higher costs from trade conflict and supply disruptions.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11583, "text": "Short-term inflation expectations have risen in light of fears about the impact of tariffs on prices.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11506, "text": "The recent strengthening in both consumption and housing activity is expected to continue.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 11659, "text": "Recent surveys indicate that households continue to expect that tariffs will raise prices and many businesses say they intend to pass on the costs of higher tariffs.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11581, "text": "Inflation is expected to increase to about 2\u00bd% in March with the end of the tax break.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11657, "text": "Excluding taxes, inflation rose 2.3% in April, slightly stronger than the Bank had expected.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11501, "text": "US bond yields have risen, supported by strong growth and more persistent inflation.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 11564, "text": "Economic growth in the euro zone was modest in late 2024.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11561, "text": "The economic outlook continues to be subject to more-than-usual uncertainty because of the rapidly evolving policy landscape.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11555, "text": "When they begin, they will be conducted in the secondary market .", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11661, "text": "With uncertainty about US tariffs still high, the Canadian economy softer but not sharply weaker, and some unexpected firmness in recent inflation data, Governing Council decided to hold the policy rate as we gain more information on US trade policy and its impacts.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11625, "text": "Our focus will be on ensuring that Canadians continue to have confidence in price stability through this period of global upheaval.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11598, "text": "Canadian growth weakens temporarily and inflation remains around the 2% target.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11710, "text": "how much this spills over into business investment, employment and household spending", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11502, "text": "In contrast, yields in Canada are down slightly.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 11547, "text": "Initially, term repo operations will range between $2bln and $5bln.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11678, "text": "The euro area economy grew modestly in the first half of the year.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11518, "text": "A broad range of indicators, including surveys of inflation expectations and the distribution of price changes among components of the CPI, suggests that underlying inflation is close to 2%.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 11627, "text": "Governing Council will proceed carefully, with particular attention to the risks and uncertainties facing the Canadian economy.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11515, "text": "As a result, excess supply in the economy is gradually absorbed over the projection horizon.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 11549, "text": "Final operational details, including the size and specific maturity date of the term repos, will be published one week prior to the operation date.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 11708, "text": "Governing Council is proceeding carefully, with particular attention to the risks and uncertainties facing the Canadian economy.", "bank": "BOC", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 10, "text": "The Committee expects to maintain an accommodative stance of monetary policy until these outcomes are achieved.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 308, "text": "These asset purchases help foster smooth market functioning and accommodative financial conditions, thereby supporting the flow of credit to households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 632, "text": "Progress on vaccinations and an easing of supply constraints are expected to support continued gains in economic activity and employment as well as a reduction in inflation.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 334, "text": "Progress on vaccinations and an easing of supply constraints are expected to support continued gains in economic activity and employment as well as a reduction in inflation.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 338, "text": "The Committee expects to maintain an accommodative stance of monetary policy until these outcomes are achieved.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 15, "text": "These asset purchases help foster smooth market functioning and accommodative financial conditions, thereby supporting the flow of credit to households and businesses.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 109, "text": "Yields on Treasury securities of intermediate maturities increased modestly, the market-implied path of the federal funds rate steepened, domestic equity prices were unchanged, and speculative-grade corporate bond spreads narrowed modestly.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 641, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 232, "text": "A number of participants judged that the uncertain course of the virus, supply chain disruptions, and labor shortages complicated the task of interpreting incoming economic data and assessing progress toward the Committee's goals.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 553, "text": "Several participants commented on the financial stability risks\u00e2\u0080\u0094including those relating to maturity and liquidity transformation\u00e2\u0080\u0094associated with stablecoins and on the need for regulators to address these risks.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 25, "text": "Diana Hancock and David E. Lebow, Senior Associate Directors, Division of Research and Statistics, Board Don H. Kim, Edward Nelson, and Annette Vissing-J\u00f8rgensen, Senior Advisers, Division of Monetary Affairs, Board", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 329, "text": "The sectors most adversely affected by the pandemic have improved in recent months, but the summer's rise in COVID-19 cases has slowed their recovery.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 19, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Thomas I. Barkin; Raphael W. Bostic; Michelle W. Bowman; Lael Brainard; Richard H. Clarida; Mary C. Daly; Charles L. Evans; Randal K. Quarles; and Christopher J. Waller.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 335, "text": "Risks to the economic outlook remain.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 336, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 441, "text": "Short-term funding markets were stable over the intermeeting period.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 645, "text": "Implementation Note issued December 15, 2021", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 644, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Thomas I. Barkin; Raphael W. Bostic; Michelle W. Bowman; Lael Brainard; Richard H. Clarida; Mary C. Daly; Charles L. Evans; Randal K. Quarles; and Christopher J. Waller.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 634, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 631, "text": "The path of the economy continues to depend on the course of the virus.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 43, "text": "Investors remained focused on other vulnerabilities in emerging markets, and concerns had grown recently about the possible implications of developments in China.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 633, "text": "Risks to the economic outlook remain, including from new variants of the virus.", "bank": "FED", "year": 2021, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 976, "text": "Progress on vaccinations and an easing of supply constraints are expected to support continued gains in economic activity and employment as well as a reduction in inflation.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 2322, "text": "July 27, 2022 Recent indicators of spending and production have softened.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 832, "text": "Over the following two years, the boost to consumer prices caused by supply issues was expected to partly reverse, and energy prices were projected to decline.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 3030, "text": "Staff Economic Outlook The projection for U.S. economic activity prepared by the staff for the November FOMC meeting was weaker than the September forecast.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 2696, "text": "Data pointed to weak foreign growth in recent months, weighed down by the global reverberations from Russia's war against Ukraine and a loss of momentum in the Chinese economy.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 2600, "text": "At the conclusion of the discussion, the Committee voted to authorize and direct the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the SOMA in accordance with the following domestic policy directive, for release at 2:00 p.m.: \"Effective July 28, 2022, the Federal Open Market Committee directs the Desk to: The vote also encompassed approval of the statement below for release at 2:00 p.m.: \"Recent indicators of spending and production have softened.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 2364, "text": "In contrast to central banks in other advanced economies, the Bank of Japan confirmed its commitment to accommodative policy.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 829, "text": "The near-term outlook was revised up, reflecting faster-than-expected increases both for a broad array of consumer prices and for wages.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2042, "text": "In support of these goals, the Committee decided to raise the target range for the federal funds rate to 1\u00e2\u0080\u00911/2 to 1-3/4 percent and anticipates that ongoing increases in the target range will be appropriate.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2043, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in the Plans for Reducing the Size of the Federal Reserve's Balance Sheet that were issued in May.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3115, "text": "In discussing potential policy actions at upcoming meetings, participants reaffirmed their strong commitment to returning inflation to the Committee's 2 percent objective, and they continued to anticipate that ongoing increases in the target range for the federal funds rate would be appropriate in order to attain a sufficiently restrictive stance of policy to bring inflation down over time.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 1950, "text": "They also pointed out that high inflation could impede the achievement of maximum employment on a sustained basis.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1754, "text": "In addition, the Committee decided to begin reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities on June 1, as described in the Plans for Reducing the Size of the Federal Reserve's Balance Sheet that were issued in conjunction with this statement.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2038, "text": "The invasion and related events are creating additional upward pressure on inflation and are weighing on global economic activity.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 841, "text": "Given the higher forecast for inflation, the staff assumed monetary policy would be less accommodative in coming years and therefore revised down the medium-term forecast for GDP somewhat.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 1752, "text": "With appropriate firming in the stance of monetary policy, the Committee expects inflation to return to its 2 percent objective and the labor market to remain strong.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2330, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in the Plans for Reducing the Size of the Federal Reserve's Balance Sheet that were issued in May.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2895, "text": "Inflation remains elevated, reflecting supply and demand imbalances related to the pandemic, higher food and energy prices, and broader price pressures.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2577, "text": "In light of elevated inflation and the upside risks to the outlook for inflation, participants remarked that moving to a restrictive stance of the policy rate in the near term would also be appropriate from a risk-management perspective because it would better position the Committee to raise the policy rate further, to appropriately restrictive levels, if inflation were to run higher than expected.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 2530, "text": "Participants also observed that in some product categories, the rate of price increase could well pick up further in the short run, with sizable additional increases in residential rental expenses being especially likely.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1436, "text": "With appropriate firming in the stance of monetary policy, the Committee expects inflation to return to its 2 percent objective and the labor market to remain strong.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 1474, "text": "In the United States, incoming economic data and Federal Reserve communications led investors to expect a more rapid removal of policy accommodation than they had previously expected.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 2886, "text": "In the absence of the manager, the Committee's Rules of Organization provide that the deputy manager acts as manager pro tem.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 1749, "text": "In addition, COVID-related lockdowns in China are likely to exacerbate supply chain disruptions.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 2046, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 2433, "text": "The credit quality of businesses, municipalities, and households remained stable.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 2333, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 1756, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee\u00e2\u0080\u0099s goals.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 2041, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 2631, "text": "Russia's war against Ukraine is causing tremendous human and economic hardship.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 1441, "text": "The Committee's assessments will take into account a wide range of information, including readings on public health, labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 1755, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 3192, "text": "The Committee's assessments will take into account a wide range of information, including readings on public health, labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 979, "text": "In support of these goals, the Committee decided to keep the target range for the federal funds rate at 0 to 1/4 percent.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 2002, "text": "Members agreed that, in assessing the appropriate stance of monetary policy, they would continue to monitor the implications of incoming information for the economic outlook and that they would be prepared to adjust the stance of monetary policy as appropriate in the event that risks emerged that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 1734, "text": "The Federal Open Market Committee is referenced as the \"FOMC\" and the \"Committee\" in these minutes", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 975, "text": "The path of the economy continues to depend on the course of the virus.", "bank": "FED", "year": 2022, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 3779, "text": "Regarding the outlook for monetary policy, market-based measures of policy expectations suggested that the federal funds rate would reach a peak in May 2023 and that the target range would then move lower.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 4943, "text": "Total and core PCE price inflation were forecast to be around 3.5 percent at the end of this year, and inflation was projected to move lower in coming years, as demand and supply in product and labor markets continued to move into better alignment.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4485, "text": "Nevertheless, they noted some signs that supply and demand in the labor market were coming into better balance, with the prime-age labor force participation rate moving up in recent months and further reductions in rates of job openings and quits, and declines in average weekly hours.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 3316, "text": "Nevertheless, the forecast for U.S. real GDP growth through 2025 remained subdued.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5131, "text": "Foreign economic growth remained subdued in the third quarter.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 4730, "text": "Participants continued to view a period of below-trend growth in real GDP and some softening in labor market conditions as needed to bring aggregate supply and aggregate demand into better balance and reduce inflation pressures sufficiently to return inflation to 2 percent over time.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4740, "text": "They noted evidence that labor demand was easing\u00e2\u0080\u0094including declines in job openings, lower quits rates, more part-time work, slower growth in hours worked, higher unemployment insurance claims, and more moderate rates of nominal wage growth.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 4219, "text": "Regarding housing services inflation, participants observed that soft readings on rents for leases signed by new tenants were starting to feed into measured inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4872, "text": "The imbalance between labor demand and supply appeared to be easing.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "employment"}, {"id": 4984, "text": "Participants pointed to the softening of price inflation for goods amid improving supply conditions and to declining housing services inflation.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 4760, "text": "The labor market remained very tight, with robust job gains in recent months and the unemployment rate still low, but there were continuing signs that supply and demand in the labor market were coming into better balance.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 4827, "text": "Inflation remains elevated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4026, "text": "In determining the extent to which additional policy firming may be appropriate to return inflation to 2 percent over time, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3943, "text": "Against this backdrop, all participants agreed that it was appropriate to raise the target range for the federal funds rate 25 basis points to 4-3/4 to 5 percent.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3455, "text": "In support of these goals, the Committee decided to raise the target range for the federal funds rate to 4-1/2 to 4-3/4 percent.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4636, "text": "In this context, and amid tight labor market conditions, many AFE central banks raised policy rates and underscored the need to raise rates further, or hold them at sufficiently restrictive levels, to bring inflation in their countries back to their targets.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5053, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4513, "text": "In discussing the policy outlook, all participants continued to anticipate that, with inflation still well above the Committee's 2 percent goal and the labor market remaining very tight, maintaining a restrictive stance for monetary policy would be appropriate to achieve the Committee's objectives.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4581, "text": "In determining the extent of additional policy firming that may be appropriate to return inflation to 2 percent over time, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3457, "text": "In determining the extent of future increases in the target range, the Committee will take into account the cumulative tightening of monetary policy, the lags with which monetary policy affects economic activity and inflation, and economic and financial developments.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3917, "text": "Participants agreed that the labor market remained very tight.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "employment"}, {"id": 3744, "text": "Inflation remains elevated.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 4093, "text": "Core inflation showed signs of easing in some foreign economies but remained persistently elevated amid tight labor markets.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 3729, "text": "To support the Committee's decision to raise the target range for the federal funds rate, the Board of Governors of the Federal Reserve System voted unanimously to raise the interest rate paid on reserve balances to 4.65 percent, effective February 2, 2023.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 3458, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 4322, "text": "In support of these goals, the Committee decided to maintain the target range for the federal funds rate at 5 to 5-1/4 percent.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 4839, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 4180, "text": "Participants agreed that the U.S. banking system was sound and resilient.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 3745, "text": "The U.S. banking system is sound and resilient.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 4897, "text": "Yields on medium- and longer-term nominal Treasury securities rose more substantially, mainly reflecting higher term premiums and higher real yields.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 4584, "text": "In assessing the appropriate stance of monetary policy, the Committee will continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 4480, "text": "Some participants remarked that the effect of high interest rates on the housing sector appeared to be bottoming out, with home sales, builder sentiment, and new construction all having improved a little since the start of the year.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 3596, "text": "While measures of hedge fund leverage have decreased since the pandemic shock, the staff noted that leverage among the largest funds was on track to return to 2019 levels.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 4618, "text": "Average hourly earnings rose 4.4 percent over the 12 months ending in June, compared with a year\u00ad-earlier increase of 5.4 percent.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 4589, "text": "Implementation Note issued July 26, 2023", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 5150, "text": "Longer-term sovereign bond yields for advanced foreign economies rose, foreign equity prices declined, foreign credit spreads generally widened, and investors continued to withdraw from emerging market economy funds.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 4585, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 3902, "text": "Participants agreed that the actions taken so far by the Federal Reserve in coordination with other government agencies, as well as actions taken by foreign authorities to address banking and financial stresses outside the U.S., had helped calm conditions in the banking sector.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 5346, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Michael S. Barr; Michelle W. Bowman; Lisa D. Cook; Austan D. Goolsbee; Patrick Harker; Philip N. Jefferson; Neel Kashkari; Adriana D. Kugler; Lorie K. Logan; and Christopher J. Waller.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 4655, "text": "Conditions in domestic short-term funding markets remained generally stable over the intermeeting period.", "bank": "FED", "year": 2023, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 5350, "text": "Financial conditions eased, driven by a decline in interest rates, an increase in equity prices, and a depreciation in the dollar.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 7358, "text": "In support of its goals, the Committee decided to lower the target range for the federal funds rate by 1/4 percentage point to 4-1/4 to 4-1/2 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6981, "text": "The staff judged that the risks around the baseline forecast for economic activity were tilted to the downside, as the recent softening in some indicators of labor market conditions could point to greater slowing in aggregate demand growth than expected.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6282, "text": "Many participants noted signs that the finances of low- and moderate-income households were increasingly coming under pressure, which these participants saw as a downside risk to the outlook for consumption.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5617, "text": "The modal path implied by options prices declined some over the intermeeting period.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6633, "text": "Financial conditions eased modestly over the intermeeting period, reflecting lower long-term interest rates and higher equity prices.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 6868, "text": "In light of the progress on inflation and the balance of risks, the Committee decided to lower the target range for the federal funds rate by 1/2 percentage point to 4-3/4 to 5 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6979, "text": "Both total and core PCE price inflation were expected to decline further as supply and demand in labor and product markets continued to move into better balance", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 6929, "text": "Real GDP growth in foreign economies stepped down in the second quarter, and recent economic indicators suggested economic growth abroad remained subdued.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 6501, "text": "in addition, deteriorating household financial positions, especially for lower-income households, might prove to have a larger negative effect on economic activity than the staff anticipated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 5664, "text": "A straight read of federal funds futures rates suggested that market participants were placing higher odds on significant policy easing in 2024 than they did just before the December FOMC meeting.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6876, "text": "Voting against this action was Michelle W. Bowman, who preferred to lower the target range for the federal funds rate by 1/4 percentage point at this meeting.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7102, "text": "In support of its goals, the Committee decided to lower the target range for the federal funds rate by 1/4 percentage point to 4-1/2 to 4-3/4 percent.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 6132, "text": "The policy rate path derived from futures prices implied fewer than two 25 basis point rate cuts by year-end.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7332, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7354, "text": "Inflation has made progress toward the Committee's 2 percent objective but remains somewhat elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7075, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 5853, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6054, "text": "The possibility that geopolitical events or surges in domestic demand could generate increased energy prices was also seen as an upside risk to inflation.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5558, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7360, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6119, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6095, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 6870, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 7098, "text": "Inflation has made progress toward the Committee's 2 percent objective but remains somewhat elevated.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 6934, "text": "In the AFEs excluding Japan, 12-month headline inflation ticked down but remained above target levels due to still-high services inflation.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 5968, "text": "This policy rate hike was the first by the BOJ in 17 years.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 5583, "text": "In addition, the Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage-backed securities, as described in its previously announced plans.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 5844, "text": "March 20, 2024 Recent indicators suggest that economic activity has been expanding at a solid pace.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "growth"}, {"id": 7112, "text": "November 6\u00e2\u0080\u00937, 2024 A joint meeting of the Federal Open Market Committee and the Board of Governors of the Federal Reserve System was held in the offices of the Board of Governors on Wednesday, November 6, 2024, at 10:00 a.m. and continued on Thursday, November 7, 2024, at 9:00 a.m. 1 Developments in Financial Markets and Open Market Operations The manager turned first to a review of developments in financial markets.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 6951, "text": "In domestic credit markets, borrowing costs remained elevated despite modest declines in most credit segments.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 7357, "text": "The economic outlook is uncertain, and the Committee is attentive to the risks to both sides of its dual mandate.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 6376, "text": "The Committee judges that the risks to achieving its employment and inflation goals have moved toward better balance over the past year.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7095, "text": "Attended through the discussion of the economic and financial situation.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 6626, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 6742, "text": "Participants' Views on Current Conditions and the Economic Outlook Participants observed that inflation had eased over the past year but remained elevated and that, in recent months, there had been some further progress toward the Committee's 2 percent inflation objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 7109, "text": "Voting for the monetary policy action were Jerome H. Powell, Chair; John C. Williams, Vice Chair; Thomas I. Barkin; Michael S. Barr; Raphael W. Bostic; Michelle W. Bowman; Lisa D. Cook; Mary C. Daly; Beth M. Hammack; Philip N. Jefferson; Adriana D. Kugler; and Christopher J. Waller.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 6621, "text": "In considering any adjustments to the target range for the federal funds rate, the Committee will carefully assess incoming data, the evolving outlook, and the balance of risks.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 7188, "text": "Over the intermeeting period, government money market funds (MMFs) continued to increase allocations to Treasury bills and private repo in light of the generally favorable rates on these instruments", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 7348, "text": "The vote also encompassed approval by the Board of Governors of the establishment of a 4.75 percent primary credit rate by the remaining Federal Reserve Banks, effective on November 8, 2024, or the date such Reserve Banks inform the Secretary of the Board of such a request.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 5848, "text": "The Committee judges that the risks to achieving its employment and inflation goals are moving into better balance.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7099, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6616, "text": "In recent months, there has been some further progress toward the Committee's 2 percent inflation objective.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 6125, "text": "The Committee's assessments will take into account a wide range of information, including readings on labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2024, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8665, "text": "Voting against this action were Michelle W. Bowman and Christopher J. Waller, who preferred to lower the target range for the federal funds rate by 1/4 percentage point at this meeting.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7578, "text": "Consistent with the Committee's decision to lower the target range for the federal funds rate to 4-1/4 to 4-1/2 percent, the Board of Governors of the Federal Reserve System voted unanimously to lower the interest rate paid on reserve balances to 4.4 percent, effective December 19, 2024.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 7399, "text": "Market participants' views varied on how much downward pressure this adjustment would put on money market rates, but repo rates were generally expected to fall more than the federal funds rate.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "financial_stability"}, {"id": 8497, "text": "Many foreign central banks eased policy during the intermeeting period, citing concerns about economic growth and, in some cases, further progress on restoring price stability.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 7553, "text": "In support of its goals, the Committee agreed to lower the target range for the federal funds rate by 25 basis points to 4-1/4 to 4-1/2 percent.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "guidance"}, {"id": 8441, "text": "However, futures-based policy expectations beyond the next few quarters had not fully retraced the decline seen over the previous intermeeting period, suggesting that perceived medium- and longer-term downside risks to growth remained larger than before the April tariff announcements.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "growth"}, {"id": 7499, "text": "Participants cited various factors as being likely to put continuing downward pressure on inflation, including waning business pricing power, the Committee's still-restrictive monetary policy stance, and well-anchored longer-term inflation expectations.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 8019, "text": "After that, inflation was projected to decline to 2 percent by 2027.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "dovish", "llm_stance": "dovish", "llm_topic": "inflation"}, {"id": 8107, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8139, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8307, "text": "While most indicators had suggested that longer-term inflation expectations remained well anchored, some participants saw the risk that they could drift upward, which could put additional upward pressure on inflation.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7767, "text": "The risks around the baseline projection for inflation were seen as skewed to the upside because core inflation had not come down as much as expected in 2024 and because changes to trade policy could put more upward pressure on inflation than the staff had assumed.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8406, "text": "Inflation remains somewhat elevated.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7493, "text": "A couple of participants judged that positive sentiment in financial markets and momentum in economic activity could continue to put upward pressure on inflation.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7381, "text": "The average estimate of survey respondents for the timing of the end of balance sheet runoff shifted a bit later, to June 2025.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8570, "text": "Several participants commented that shorter-term inflation expectations had been elevated and that this development had the potential to spill over into longer-term expectations or to affect price and wage setting in the near term.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7782, "text": "Business contacts in a number of Districts had indicated that firms would attempt to pass on to consumers higher input costs arising from potential tariffs.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7595, "text": "Inflation remains somewhat elevated.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8659, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8072, "text": "In discussing risk-management considerations that could bear on the outlook for monetary policy, participants assessed that uncertainty around the economic outlook had increased, with almost all participants viewing risks to inflation as tilted to the upside and risks to employment as tilted to the downside.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7522, "text": "Almost all participants judged that upside risks to the inflation outlook had increased.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 8653, "text": "Inflation remains somewhat elevated.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "inflation"}, {"id": 7601, "text": "The Committee will continue reducing its holdings of Treasury securities and agency debt and agency mortgage\u00e2\u0080\u0091backed securities.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "hawkish", "llm_stance": "hawkish", "llm_topic": "guidance"}, {"id": 8489, "text": "After surging in the first quarter ahead of expected tariff hikes, U.S. imports\u00e2\u0080\u0094especially of consumer goods\u00e2\u0080\u0094declined sharply in April.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "growth"}, {"id": 8423, "text": "The staff also considered the role of scenario analysis as a tool to communicate to the public risks and uncertainty around the economic outlook and their implications for monetary policy.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 7596, "text": "The Committee seeks to achieve maximum employment and inflation at the rate of 2 percent over the longer run.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 8660, "text": "The Committee is strongly committed to supporting maximum employment and returning inflation to its 2 percent objective.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "inflation"}, {"id": 8387, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8516, "text": "Yields on higher-rated tranches of commercial mortgage-backed securities (CMBS) were little changed or increased slightly, whereas yields on lower-rated CMBS tranches declined, notably so for non-agency securities.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 7753, "text": "Regulatory capital ratios in the banking sector remained high", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8415, "text": "The Committee would be prepared to adjust the stance of monetary policy as appropriate if risks emerge that could impede the attainment of the Committee's goals.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8279, "text": "In the nonbank sector, leverage at hedge funds stayed high.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 8145, "text": "Neel Kashkari voted as an alternate member at this meeting.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 7393, "text": "Usage of the overnight reverse repurchase agreement (ON RRP) facility continued its decline over the intermeeting period.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "financial_stability"}, {"id": 7599, "text": "In support of its goals, the Committee decided to maintain the target range for the federal funds rate at 4-1/4 to 4-1/2 percent.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 8143, "text": "The Committee's assessments will take into account a wide range of information, including readings on labor market conditions, inflation pressures and inflation expectations, and financial and international developments.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}, {"id": 7415, "text": "The unemployment rates for African Americans and for Hispanics also moved up, and both rates were above those for Asians and for Whites.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "employment"}, {"id": 7559, "text": "Members agreed that, in assessing the appropriate stance of monetary policy, the Committee would continue to monitor the implications of incoming information for the economic outlook.", "bank": "FED", "year": 2025, "in_eval": false, "disagree": false, "dict_stance": "neutral", "llm_stance": "neutral", "llm_topic": "guidance"}];
const TOPICS = ["inflation", "employment", "growth", "financial_stability", "guidance"];
const decisions = JSON.parse(localStorage.getItem("cbsent_review") || "{}");

function save() {
  localStorage.setItem("cbsent_review", JSON.stringify(decisions));
  const n = Object.keys(decisions).length;
  document.getElementById("progress").textContent =
    "  " + n + " of " + QUEUE.length + " reviewed";
}

function render() {
  const root = document.getElementById("queue");
  root.innerHTML = "";
  for (const item of QUEUE) {
    const card = document.createElement("div");
    card.className = "card" + (decisions[item.id] ? " done" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    const tagClass = item.in_eval ? "eval" : (item.disagree ? "disagree" : "");
    meta.innerHTML =
      '<span class="tag ' + tagClass + '">' +
      (item.in_eval ? "held-out window" : (item.disagree ? "disagreement" : "sample")) +
      '</span><span class="tag">' + item.bank + " " + item.year + '</span>' +
      "dictionary: " + item.dict_stance + "  |  llm: " + item.llm_stance +
      " / " + item.llm_topic;
    card.appendChild(meta);

    const sentence = document.createElement("div");
    sentence.className = "sentence";
    sentence.textContent = item.text;
    card.appendChild(sentence);

    const controls = document.createElement("div");
    for (const stance of ["hawkish", "dovish", "neutral"]) {
      const b = document.createElement("button");
      b.textContent = stance;
      if (decisions[item.id] && decisions[item.id].stance === stance) b.className = "sel";
      b.onclick = () => {
        const topic = card.querySelector("select").value;
        decisions[item.id] = { stance: stance, topic: topic };
        save(); render();
      };
      controls.appendChild(b);
    }
    const sel = document.createElement("select");
    for (const t of TOPICS) {
      const o = document.createElement("option");
      o.value = t; o.textContent = t;
      if ((decisions[item.id] ? decisions[item.id].topic : item.llm_topic) === t) {
        o.selected = true;
      }
      sel.appendChild(o);
    }
    sel.onchange = () => {
      if (decisions[item.id]) {
        decisions[item.id].topic = sel.value; save();
      }
    };
    controls.appendChild(sel);
    card.appendChild(controls);
    root.appendChild(card);
  }
  save();
}

document.getElementById("export").onclick = () => {
  let csv = "sentence_id,stance,topic\n";
  for (const [id, d] of Object.entries(decisions)) {
    csv += id + "," + d.stance + "," + d.topic + "\n";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "reviewed.csv";
  a.click();
};

render();
</script>
