[project]
name = "cbsent"
version = "0.1.0"
description = "Hawkish-dovish sentiment engine for Fed and Bank of Canada communications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.scripts]
cbsent = "cbsent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cbsent"]
