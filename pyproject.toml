[project]
name = "cbsent"
version = "0.1.0"
description = "Hawkish-dovish sentiment engine for Fed and Bank of Canada communications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Everything needed to score text with the model.
model = [
    "torch>=2.4",
    "transformers>=4.44",
    "numpy>=1.26",
]
# Everything needed to reproduce every number in RESULTS.md.
research = [
    "torch>=2.4",
    "transformers>=4.44",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "openai>=1.40",
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cbsent = "cbsent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cbsent"]
